<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convidados e Mesas | Casamento Perfeito</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f4f2;
            color: #333;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #eee;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #8b5e5e;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 600;
        }

        .btn-primary {
            background: #8b5e5e;
            color: white;
        }

        .btn-secondary {
            background: #eee7e4;
            color: #5d4545;
        }

        .btn-danger {
            background: #f7dede;
            color: #9b3333;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 30px 20px 60px;
        }

        .hero {
            background: linear-gradient(135deg, #8b5e5e, #b98282);
            color: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .hero p {
            margin: 0;
            opacity: .9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border-radius: 15px;
            padding: 18px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
        }

        .stat-label {
            font-size: 13px;
            color: #777;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: bold;
            color: #8b5e5e;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,.05);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            border: none;
            background: #f1ecea;
            color: #665050;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 600;
        }

        .tab.active {
            background: #8b5e5e;
            color: white;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 2fr repeat(4, 1fr) auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input,
        .select,
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 11px 12px;
            background: white;
            outline: none;
        }

        .input:focus,
        .select:focus,
        textarea:focus {
            border-color: #a87676;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 13px 10px;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }

        th {
            color: #777;
            font-size: 13px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-green {
            background: #def2e3;
            color: #2d7741;
        }

        .badge-yellow {
            background: #fff1c9;
            color: #806315;
        }

        .badge-red {
            background: #f8dddd;
            color: #9a3434;
        }

        .badge-gray {
            background: #eee;
            color: #666;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            border: none;
            background: #f1ecea;
            border-radius: 8px;
            padding: 7px 9px;
        }

        .empty {
            text-align: center;
            padding: 45px 20px;
            color: #777;
        }

        .empty strong {
            display: block;
            color: #555;
            margin-bottom: 7px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(800px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            padding: 25px;
        }

        .modal h2 {
            margin-top: 0;
            color: #6f4b4b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            position: relative;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .suggestions {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,.12);
            z-index: 50;
            padding: 7px;
        }

        .suggestions.open {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .suggestion {
            border: 1px solid #e1d5d2;
            background: #faf6f5;
            color: #704f4f;
            padding: 7px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .suggestion:hover {
            background: #8b5e5e;
            color: white;
            border-color: #8b5e5e;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #f8dddd;
            color: #8f3030;
        }

        .message.success {
            background: #def2e3;
            color: #2d7741;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 15px;
        }

        .table-card {
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 18px;
        }

        .table-card h3 {
            margin: 0 0 8px;
            color: #765252;
        }

        .table-card p {
            margin: 5px 0;
            color: #777;
        }

        .map {
            min-height: 350px;
            background: #f7f4f2;
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            align-items: center;
            justify-content: center;
        }

        .map-table {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: white;
            border: 5px solid #c9aaaa;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
        }

        .map-table strong {
            color: #704f4f;
        }

        .map-table span {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        @media (max-width: 1000px) {
            .stats {
                grid-template-columns: repeat(3, 1fr);
            }

            .toolbar {
                grid-template-columns: repeat(2, 1fr);
            }

            .toolbar .search {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 650px) {
            .topbar {
                padding: 14px;
            }

            .container {
                padding: 20px 12px 40px;
            }

            .hero {
                padding: 22px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="logo">💍 Casamento Perfeito</div>

    <div class="top-actions">
        <button type="button" class="btn btn-secondary" onclick="voltarDashboard()">
            ← Dashboard
        </button>

        <button type="button" class="btn btn-danger" onclick="sair()">
            Sair
        </button>
    </div>
</header>

<main class="container">

    <section class="hero">
        <h1>👥 Convidados e Mesas</h1>
        <p>Organize os seus convidados, confirmações e lugares do casamento.</p>
    </section>

    <div id="message" class="message"></div>

    <section class="stats">
        <div class="stat">
            <div class="stat-label">Total</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Confirmados</div>
            <div class="stat-value" id="statConfirmados">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Pendentes</div>
            <div class="stat-value" id="statPendentes">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Não vão</div>
            <div class="stat-value" id="statNaoVai">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Adultos</div>
            <div class="stat-value" id="statAdultos">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Crianças</div>
            <div class="stat-value" id="statCriancas">0</div>
        </div>
    </section>

    <section class="card">

        <div class="tabs">
            <button type="button" class="tab active" data-tab="convidados">
                👥 Convidados
            </button>

            <button type="button" class="tab" data-tab="mesas">
                🪑 Mesas
            </button>

            <button type="button" class="tab" data-tab="mapa">
                🗺️ Mapa
            </button>
        </div>

        <!-- CONVIDADOS -->
        <div id="tab-convidados">

            <div class="toolbar">

                <input
                    id="search"
                    class="input search"
                    type="search"
                    placeholder="🔎 Procurar convidado..."
                >

                <select id="filterRsvp" class="select">
                    <option value="">Todos RSVP</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Confirmado">Confirmado</option>
                    <option value="Não vai">Não vai</option>
                </select>

                <select id="filterLado" class="select">
                    <option value="">Todos os lados</option>
                    <option value="Noiva">Noiva</option>
                    <option value="Noivo">Noivo</option>
                    <option value="Ambos">Ambos</option>
                </select>

                <select id="filterTipo" class="select">
                    <option value="">Adultos e crianças</option>
                    <option value="Adulto">Adulto</option>
                    <option value="Criança">Criança</option>
                </select>

                <select id="filterMesa" class="select">
                    <option value="">Todas as mesas</option>
                </select>

                <button type="button" class="btn btn-primary" onclick="abrirConvidado()">
                    + Convidado
                </button>

            </div>

            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Grupo</th>
                            <th>Lado</th>
                            <th>Tipo</th>
                            <th>RSVP</th>
                            <th>Mesa</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="guestTableBody">
                    </tbody>
                </table>

            </div>

        </div>

        <!-- MESAS -->
        <div id="tab-mesas" style="display:none;">

            <div style="display:flex;justify-content:flex-end;margin-bottom:20px;">
                <button type="button" class="btn btn-primary" onclick="abrirMesa()">
                    + Nova mesa
                </button>
            </div>

            <div id="tablesContainer" class="table-grid"></div>

        </div>

        <!-- MAPA -->
        <div id="tab-mapa" style="display:none;">

            <div id="mapContainer" class="map"></div>

        </div>

    </section>

</main>

<!-- MODAL CONVIDADO -->
<div id="guestModal" class="modal-overlay">

    <div class="modal">

        <h2 id="guestModalTitle">Adicionar convidado</h2>

        <form id="guestForm">

            <input type="hidden" id="guestId">

            <div class="form-grid">

                <div class="form-group full">
                    <label for="nome">Nome completo *</label>
                    <input
                        id="nome"
                        class="input"
                        required
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">

                    <label for="grupo">Grupo / Família</label>

                    <input
                        id="grupo"
                        class="input"
                        autocomplete="off"
                    >

                    <div class="suggestions" data-for="grupo">
                        <button type="button" class="suggestion">Família</button>
                        <button type="button" class="suggestion">Amigos</button>
                        <button type="button" class="suggestion">Trabalho</button>
                        <button type="button" class="suggestion">Igreja</button>
                        <button type="button" class="suggestion">Escola</button>
                        <button type="button" class="suggestion">Vizinhos</button>
                        <button type="button" class="suggestion">Padrinhos</button>
                    </div>

                </div>

                <div class="form-group">

                    <label for="relacao">Relação</label>

                    <input
                        id="relacao"
                        class="input"
                        autocomplete="off"
                    >

                    <div class="suggestions" data-for="relacao">
                        <button type="button" class="suggestion">Pai</button>
                        <button type="button" class="suggestion">Mãe</button>
                        <button type="button" class="suggestion">Irmão</button>
                        <button type="button" class="suggestion">Irmã</button>
                        <button type="button" class="suggestion">Tio</button>
                        <button type="button" class="suggestion">Tia</button>
                        <button type="button" class="suggestion">Primo</button>
                        <button type="button" class="suggestion">Prima</button>
                        <button type="button" class="suggestion">Amigo</button>
                        <button type="button" class="suggestion">Amiga</button>
                        <button type="button" class="suggestion">Colega</button>
                        <button type="button" class="suggestion">Vizinho</button>
                        <button type="button" class="suggestion">Padrinho</button>
                        <button type="button" class="suggestion">Madrinha</button>
                    </div>

                </div>

                <div class="form-group">

                    <label for="lado">Lado</label>

                    <select id="lado" class="select">
                        <option value="Noiva">Noiva</option>
                        <option value="Noivo">Noivo</option>
                        <option value="Ambos">Ambos</option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="tipo">Tipo</label>

                    <select id="tipo" class="select">
                        <option value="Adulto">Adulto</option>
                        <option value="Criança">Criança</option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="telefone">Telefone</label>

                    <input
                        id="telefone"
                        class="input"
                        type="tel"
                    >

                </div>

                <div class="form-group">

                    <label for="whatsapp">WhatsApp</label>

                    <input
                        id="whatsapp"
                        class="input"
                        type="tel"
                    >

                </div>

                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        id="email"
                        class="input"
                        type="email"
                    >

                </div>

                <div class="form-group">

                    <label for="rsvp">RSVP</label>

                    <select id="rsvp" class="select">
                        <option value="Pendente">Pendente</option>
                        <option value="Confirmado">Confirmado</option>
                        <option value="Não vai">Não vai</option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="acompanhante">Acompanhante</label>

                    <select id="acompanhante" class="select">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="nomeAcompanhante">Nome do acompanhante</label>

                    <input

                        class="input"

                </div>

                <div class="form-group">

                    <label for="alimentacao">Restrição alimentar</label>

                    <input

                        class="input"

                    <div class="suggestions" data-for="alimentacao">

                        <button type="button" class="suggestion">Vegetariana</button>

                        <button type="button" class="suggestion">Sem lactose</button>
                        <button type="button" class="suggestion">Vegana</button>
                        <button type="button" class="suggestion">Outra</button>

                <div class="form-group">

                    <label for="mesa">Mesa</label>

                    <select id="mesa" class="select">
                        <option value="">Sem mesa</option>

                </div>

                    <label for="lugar">Lugar</label>

                    <input
                        id="lugar"
                        class="input"
                        type="number"

                <div class="form-group full">

                    <label for="notas">Observações</label>

                    <input
                        id="notas"
                        class="input"
                        autocomplete="off"
                    >

                    <div class="suggestions" data-for="notas">
                        <button type="button" class="suggestion">
                            Precisa de transporte
                        </button>

                        <button type="button" class="suggestion">
                            Vai com crianças
                        </button>

                        <button type="button" class="suggestion">
                            Precisa de lugar especial
                        </button>

                        <button type="button" class="suggestion">
                            Família próxima
                        </button>

                        <button type="button" class="suggestion">
                            Padrinho/Madrinha

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="fecharModal('guestModal')"

                    Cancelar

                <button
                    type="submit"
                    class="btn btn-primary"

                    Guardar convidado
                </button>

            </div>

        </form>

    </div>

</div>

<!-- MODAL MESA -->
<div id="tableModal" class="modal-overlay">

    <div class="modal">

        <h2 id="tableModalTitle">Nova mesa</h2>

        <form id="tableForm">

            <input type="hidden" id="tableId">

            <div class="form-group">
                <label for="tableName">Nome / Número da mesa *</label>

                <input
                    id="tableName"
                    class="input"
                    required
                    placeholder="Ex.: Mesa 1"
                >
            </div>

            <div class="form-group" style="margin-top:15px;">
                <label for="tableSeats">Número de lugares</label>

                <input
                    id="tableSeats"
                    class="input"
                    type="number"
                    min="1"
                    value="8"
                >
            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="fecharModal('tableModal')"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Guardar mesa
                </button>

            </div>

        </form>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://yucymctjoqbxpipmpzir.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_dyhLNw_TpWigMqYjxlPktA_vwW0aUBH";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   ESTADO
========================================================= */

let utilizadorAtual = null;
let casamentoAtual = null;
let convidados = [];
let mesas = [];

const STORAGE_TABLES =
    "casamentoPerfeitoMesas_v1";


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

    configurarTabs();
    configurarSugestoes();
    configurarFormularios();
    configurarFiltros();

    await verificarSessao();

});


/* =========================================================
   SESSÃO SUPABASE
========================================================= */

async function verificarSessao() {

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if (error) {
            throw error;
        }

        const session = data.session;

        if (!session) {

            window.location.replace(
                "login.html"
            );

            return;
        }

        utilizadorAtual =
            session.user;

        await carregarDados();

    } catch (error) {

        console.error(error);

        mostrarMensagem(
            "Não foi possível verificar a sessão.",
            "error"
        );
    }
}


/* =========================================================
   CARREGAR DADOS
========================================================= */

async function carregarDados() {

    try {

        if (!utilizadorAtual) {
            return;
        }

        const {
            data: casamento,
            error: erroCasamento
        } = await supabaseClient
            .from("weddings")
            .select("*")
            .eq(
                "user_id",
                utilizadorAtual.id
            )
            .order(
                "criado_em",
                {
                    ascending: true
                }
            )
            .limit(1)
            .maybeSingle();

        if (erroCasamento) {
            throw erroCasamento;
        }

        casamentoAtual =
            casamento;

        if (!casamentoAtual) {

            mostrarMensagem(
                "Ainda não existe um casamento configurado para esta conta.",
                "error"
            );

            renderizarTudo();

            return;
        }

        await carregarConvidados();
        carregarMesas();

        renderizarTudo();

    } catch (error) {

        console.error(
            "Erro ao carregar dados:",
            error
        );

        mostrarMensagem(
            "Não foi possível carregar os dados dos convidados.",
            "error"
        );
    }
}


/* =========================================================
   CONVIDADOS
========================================================= */

async function carregarConvidados() {

    if (!casamentoAtual) {
        convidados = [];
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("guests")
        .select("*")
        .eq(
            "wedding_id",
            casamentoAtual.id
        )
        .order(
            "nome",
            {
                ascending: true
            }
        );

    if (error) {
        throw error;
    }

    convidados =
        data || [];
}


/* =========================================================
   MESAS
========================================================= */

function carregarMesas() {

    try {

        const dados =
            localStorage.getItem(
                STORAGE_TABLES
            );

        if (!dados) {
            mesas = [];
            return;
        }

        const parsed =
            JSON.parse(dados);

        mesas =
            Array.isArray(parsed)
                ? parsed
                : [];

    } catch (error) {

        console.error(
            "Erro ao carregar mesas:",
            error
        );

        mesas = [];
    }
}


function guardarMesas() {

    localStorage.setItem(
        STORAGE_TABLES,
        JSON.stringify(mesas)
    );
}

/* =========================================================
   LISTA DE CONVIDADOS
========================================================= */

function renderizarConvidados() {

    const tbody =
        document.getElementById(
            "guestTableBody"
        );

    const pesquisa =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();

    const rsvp =
        document.getElementById(
            "filterRsvp"
        ).value;

    const lado =
        document.getElementById(
            "filterLado"
        ).value;

    const tipo =
        document.getElementById(
            "filterTipo"
        ).value;

    const mesa =
        document.getElementById(
            "filterMesa"
        ).value;

    const filtrados =
        convidados.filter(
            convidado => {

                const texto = [
                    convidado.nome,
                    convidado.grupo,
                    convidado.relacao,
                    convidado.telefone,
                    convidado.whatsapp,
                    convidado.email
                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();

                if (
                    pesquisa &&
                    !texto.includes(pesquisa)
                ) {
                    return false;
                }

                if (
                    rsvp &&
                    convidado.rsvp !== rsvp
                ) {
                    return false;
                }

                if (
                    lado &&
                    convidado.lado !== lado
                ) {
                    return false;
                }

                if (
                    tipo &&
                    convidado.tipo !== tipo
                ) {
                    return false;
                }

                if (mesa) {

                    if (
                        mesa === "sem-mesa" &&
                        convidado.mesa_id
                    ) {
                        return false;
                    }

                    if (
                        mesa !== "sem-mesa" &&
                        convidado.mesa_id !== mesa
                    ) {
                        return false;
                    }
                }

                return true;
            }
        );

    if (!filtrados.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    <div class="empty">
                        <strong>Nenhum convidado encontrado</strong>
                        Adicione um convidado ou altere os filtros.
                    </div>
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML =
        filtrados
            .map(convidado => {

                const mesa =
                    mesas.find(
                        m =>
                            String(m.id) ===
                            String(convidado.mesa_id)
                    );

                return `
                    <tr>

                        <td>
                            <strong>
                                ${esc(convidado.nome)}
                            </strong>
                        </td>

                        <td>
                            ${esc(convidado.grupo || "—")}
                        </td>

                        <td>
                            ${esc(convidado.lado || "—")}
                        </td>

                        <td>
                            ${esc(convidado.tipo || "—")}
                        </td>

                        <td>
                            ${badgeRsvp(convidado.rsvp)}
                        </td>

                        <td>
                            ${
                                mesa
                                    ? esc(mesa.nome)
                                    : "Sem mesa"
                            }
                        </td>

                        <td>

                            <div class="actions">

                                <button
                                    type="button"
                                    class="icon-btn"
                                    onclick="editarConvidado('${convidado.id}')"
                                    title="Editar"
                                >
                                    ✏️
                                </button>

                                <button
                                    type="button"
                                    class="icon-btn"
                                    onclick="eliminarConvidado('${convidado.id}')"
                                    title="Eliminar"
                                >
                                    🗑️
                                </button>

                            </div>

                        </td>

                    </tr>
                `;
            })
            .join("");
}


function badgeRsvp(rsvp) {

    if (rsvp === "Confirmado") {
        return `
            <span class="badge badge-green">
                Confirmado
            </span>
        `;
    }

    if (rsvp === "Não vai") {
        return `
            <span class="badge badge-red">
                Não vai
            </span>
        `;
    }

    return `
        <span class="badge badge-yellow">
            Pendente
        </span>
    `;
}

/* =========================================================
   GUARDAR CONVIDADO
========================================================= */

async function guardarConvidado(event) {

    event.preventDefault();

    if (!casamentoAtual) {

        mostrarMensagem(
            "Não foi encontrado o casamento desta conta.",
            "error"
        );

        return;
    }

    const id =
        document.getElementById(
            "guestId"
        ).value;

    const dados = {

        wedding_id:
            casamentoAtual.id,

        nome:
            document.getElementById(
                "nome"
            ).value.trim(),

        grupo:
            document.getElementById(
                "grupo"
            ).value.trim() || null,

        relacao:
            document.getElementById(
                "relacao"
            ).value.trim() || null,

        lado:
            document.getElementById(
                "lado"
            ).value,

        tipo:
            document.getElementById(
                "tipo"
            ).value,

        telefone:
            document.getElementById(
                "telefone"
            ).value.trim() || null,

        whatsapp:
            document.getElementById(
                "whatsapp"
            ).value.trim() || null,

        email:
            document.getElementById(
                "email"
            ).value.trim() || null,

        rsvp:
            document.getElementById(
                "rsvp"
            ).value,

        acompanhante:
            document.getElementById(
                "acompanhante"
            ).value,

        nome_acompanhante:
            document.getElementById(
                "nomeAcompanhante"
            ).value.trim() || null,

        alimentacao:
            document.getElementById(
                "alimentacao"
            ).value.trim() || "Normal",

        mesa_id:
            document.getElementById(
                "mesa"
            ).value || null,

        lugar:
            document.getElementById(
                "lugar"
            ).value
                ? Number(
                    document.getElementById(
                        "lugar"
                    ).value
                )
                : null,

        notas:
            document.getElementById(
                "notas"
            ).value.trim() || null
    };

    if (!dados.nome) {

        mostrarMensagem(
            "O nome do convidado é obrigatório.",
            "error"
        );

        return;
    }

    try {

        let resultado;

        if (id) {

            resultado =
                await supabaseClient
                    .from("guests")
                    .update(dados)
                    .eq(
                        "id",
                        id
                    )
                    .eq(
                        "wedding_id",
                        casamentoAtual.id
                    );

        } else {

            resultado =
                await supabaseClient
                    .from("guests")
                    .insert(
                        dados
                    );
        }

        if (resultado.error) {
            throw resultado.error;
        }

        fecharModal(
            "guestModal"
        );

        await carregarConvidados();

        renderizarTudo();

        mostrarMensagem(
            id
                ? "Convidado atualizado com sucesso."
                : "Convidado adicionado com sucesso.",
            "success"
        );

    } catch (error) {

        console.error(error);

        mostrarMensagem(
            "Não foi possível guardar o convidado: " +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   ELIMINAR CONVIDADO
========================================================= */

async function eliminarConvidado(id) {

    const convidado =
        convidados.find(
            c =>
                String(c.id) ===
                String(id)
        );

    if (!convidado) {
        return;
    }

    const confirmar =
        confirm(
            `Deseja eliminar o convidado "${convidado.nome}"?`
        );

    if (!confirmar) {
        return;
    }

    try {

        const {
            error
        } = await supabaseClient
            .from("guests")
            .delete()
            .eq(
                "id",
                id
            )
            .eq(
                "wedding_id",
                casamentoAtual.id
            );

        if (error) {
            throw error;
        }

        await carregarConvidados();

        renderizarTudo();

        mostrarMensagem(
            "Convidado eliminado.",
            "success"
        );

    } catch (error) {

        console.error(error);

        mostrarMensagem(
            "Não foi possível eliminar o convidado.",
            "error"
        );
    }
}

function editarMesa(id) {

        mesas.find(

                String(id)
        );

    if (!mesa) {
        return;
    }

    document.getElementById(

    ).value =
        mesa.id;

    document.getElementById(
        "tableName"
    ).value =
        mesa.nome;

    document.getElementById(

        "tableModalTitle"
    ).textContent =
        "Editar mesa";

    ).classList.add("open");

function guardarMesa(event) {

    event.preventDefault();

    const id =
        document.getElementById(
            "tableId"
        ).value;

    const nome =
        document.getElementById(
            "tableName"
        ).value.trim();

    const lugares =
        Number(
            document.getElementById(
                "tableSeats"
            ).value
        ) || 8;

    if (!nome) {
        return;
    }

    if (id) {

        const mesa =
            mesas.find(
                m =>
                    String(m.id) ===
                    String(id)
            );

        if (mesa) {
            mesa.nome = nome;
            mesa.lugares = lugares;
        }

    } else {

        mesas.push({
            id:
                "mesa_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8),

            nome,
            lugares
        });
    }

    guardarMesas();

    carregarMesas();

    renderizarTudo();

    fecharModal(
        "tableModal"
    );

    mostrarMensagem(
        id
            ? "Mesa atualizada."
            : "Mesa criada com sucesso.",
        "success"
    );
}


async function eliminarMesa(id) {

    const mesa =
        mesas.find(
            m =>
                String(m.id) ===
                String(id)
        );

    if (!mesa) {
        return;
    }

    const confirmar =
        confirm(
            `Eliminar a mesa "${mesa.nome}"? Os convidados continuarão no sistema, mas ficarão sem mesa.`
        );

    if (!confirmar) {
        return;
    }

    try {

        if (casamentoAtual) {

            const {
                error
            } = await supabaseClient
                .from("guests")
                .update({
                    mesa_id: null,
                    lugar: null
                })
                .eq(
                    "wedding_id",
                    casamentoAtual.id
                )
                .eq(
                    "mesa_id",
                    id
                );

            if (error) {
                throw error;
            }
        }

        mesas =
            mesas.filter(
                m =>
                    String(m.id) !==
                    String(id)
            );

        guardarMesas();

        await carregarConvidados();

        renderizarTudo();

        mostrarMensagem(
            "Mesa eliminada.",
            "success"
        );

    } catch (error) {

        console.error(error);

        mostrarMensagem(
            "Não foi possível eliminar a mesa.",
            "error"
        );
    }
}

/* =========================================================
   SUGESTÕES INTELIGENTES
========================================================= */

function configurarSugestoes() {

    document
        .querySelectorAll(
            ".suggestions"
        )
        .forEach(container => {

            const campoId =
                container.dataset.for;

            const campo =
                document.getElementById(
                    campoId
                );

            if (!campo) {
                return;
            }

            campo.addEventListener(
                "focus",
                () => {

                    fecharTodasSugestoes();

                    container.classList.add(
                        "open"
                    );
                }
            );

            campo.addEventListener(
                "input",
                () => {

                    container.classList.add(
                        "open"
                    );
                }
            );

            container
                .querySelectorAll(
                    ".suggestion"
                )
                .forEach(botao => {

                    botao.addEventListener(
                        "click",
                        () => {

                            const valor =
                                botao.textContent.trim();

                            if (
                                campo.value &&
                                campoId === "notas"
                            ) {

                                const valores =
                                    campo.value
                                        .split(",")
                                        .map(v => v.trim())
                                        .filter(Boolean);

                                if (
                                    !valores.includes(
                                        valor
                                    )
                                ) {
                                    valores.push(
                                        valor
                                    );
                                }

                                campo.value =
                                    valores.join(
                                        ", "
                                    );

                            } else {

                                campo.value =
                                    valor;
                            }

                            container.classList.remove(
                                "open"
                            );

                            campo.focus();
                        }
                    );

                });
        });


    document.addEventListener(
        "click",
        event => {

            if (
                !event.target.closest(
                    ".form-group"
                )
            ) {
                fecharTodasSugestoes();
            }

        }
    );
}


function fecharTodasSugestoes() {

    document
        .querySelectorAll(
            ".suggestions"
        )
        .forEach(el =>
            el.classList.remove(
                "open"
            )
        );
}


/* =========================================================
   MODAIS
========================================================= */

function fecharModal(id) {

    document.getElementById(
        id
    ).classList.remove(
        "open"
    );

    fecharTodasSugestoes();
}


document
    .querySelectorAll(
        ".modal-overlay"
    )
    .forEach(modal => {

        modal.addEventListener(
            "click",
            event => {

                if (
                    event.target === modal
                ) {
                    modal.classList.remove(
                        "open"
                    );
                }

            }
        );

    });


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            document
                .querySelectorAll(
                    ".modal-overlay.open"
                )
                .forEach(modal =>
                    modal.classList.remove(
                        "open"
                    )
                );

        }

    }
);


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function voltarDashboard() {

    window.location.href =
        "dashboard.html";
}


async function sair() {

    try {

        await supabaseClient.auth.signOut();

    } catch (error) {

        console.error(error);

    }

    window.location.replace(
        "login.html"
    );
}


/* =========================================================
   MENSAGENS
========================================================= */

function mostrarMensagem(
    texto,
    tipo = "success"
) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        texto;

    element.className =
        "message show " +
        tipo;

    setTimeout(
        () => {

            element.classList.remove(
                "show"
            );

        },
        4000
    );
}


/* =========================================================
   SEGURANÇA / HTML
========================================================= */

function esc(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }

    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escAttr(valor) {
    return esc(valor);
}


/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA DA SESSÃO
========================================================= */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (
            event === "SIGNED_OUT" ||
            !session
        ) {

            window.location.replace(
                "login.html"
            );
        }

    }
);

</script>
