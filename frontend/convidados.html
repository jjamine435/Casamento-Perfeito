<script>

"use strict";

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://yucymctjoqbxpipmpzir.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dyhLNw_TpWigMqYjxlPktA_vwW0aUBH";

const supabaseClient =

/* =========================================================
   ESTADO

let currentUser = null;

/* =========================================================
   HELPERS
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function showStatus(message,type="info"){

    const box =
        document.getElementById("statusBox");

    box.textContent = message;

    box.className =
        "status show " + type;

    if(type === "success"){

        setTimeout(() => {

            box.className = "status";

        },3500);
    }
}


function errorMessage(error){

    if(!error)
        return "Erro desconhecido.";

    return [
        error.message,
        error.details,
        error.hint,
        error.code
            ? "Código: " + error.code
            : ""
    ]
    .filter(Boolean)
    .join(" | ");
}


/* =========================================================
   NORMALIZAÇÃO DAS MESAS
========================================================= */

function tableName(table){

    return table.nome ??
           table.name ??
           table.numero ??
           "Mesa";
}


function tableCapacity(table){

    return Number(
        table.capacidade ??
        table.capacity ??
        0
    );
}


function tableShape(table){

    return table.formato ??
           table.shape ??
           "Redonda";
}


function tableLocation(table){

    return table.localizacao ??
           table.location ??
           "";
}


function tableNotes(table){

    return table.notas ??
           table.notes ??
           "";
}


/* =========================================================
   NORMALIZAÇÃO DOS CONVIDADOS
========================================================= */

function guestName(guest){

    return guest.nome ??
           guest.name ??
           "";
}


function guestGroup(guest){

    return guest.grupo ??

}


function guestSideValue(guest){

function guestPhone(guest){

}


function guestRsvpValue(guest){

}

}


function guestCompanionName(guest){

    return guest.nomeAcompanhante ??

}


function guestFood(guest){

    return guest.alimentacao ??
           guest.dietary ??
           guest.dietary_preference ??

}


function guestTableId(guest){

    return guest.mesa_id ??
           guest.table_id ??

}


function guestSeat(guest){

    return guest.lugar ??
           guest.seat ??

           "";
}


function guestNotes(guest){

    return guest.notas ??
           guest.notes ??
           "";
}


/* =========================================================
   ACOMPANHANTE
========================================================= */

function hasCompanion(guest){

    const value =
        guestCompanion(guest);

    return (
        value === true ||
        value === "Sim" ||
        value === "sim" ||
        value === 1 ||
        value === "1"
    );
}


/*
 * Cada convidado ocupa pelo menos um lugar.
 *
 * Se tiver acompanhante:
 *
 * 1 convidado + 1 acompanhante = 2 lugares
 */

function guestSeatCount(guest){

    return hasCompanion(guest)
        ? 2
        : 1;
}


/* =========================================================
   OCUPAÇÃO DAS MESAS
========================================================= */

function getTableGuests(tableId){

    return convidados.filter(g => {

        return String(guestTableId(g)) ===
               String(tableId);

    });
}


function getTableOccupancy(tableId){

    const guests =
        getTableGuests(tableId);

    return guests.reduce(
        (total,guest) =>
            total + guestSeatCount(guest),
        0
    );
}


function getTableFreeSeats(tableId){

    const table =
        mesas.find(
            t =>
            String(t.id) ===
            String(tableId)
        );

    if(!table)
        return 0;

    return Math.max(
        0,
        tableCapacity(table) -
        getTableOccupancy(tableId)
    );
}


function tableIsFull(tableId){

    const table =
        mesas.find(
            t =>
            String(t.id) ===
            String(tableId)
        );

    if(!table)
        return false;

    return getTableOccupancy(tableId)
        >= tableCapacity(table);
}


function tableOccupancyPercent(tableId){

    const table =
        mesas.find(
            t =>
            String(t.id) ===
            String(tableId)
        );

    if(!table)
        return 0;

    const capacity =
        tableCapacity(table);

    if(!capacity)
        return 0;

    return Math.min(
        100,
        Math.round(
            (
                getTableOccupancy(tableId) /
                capacity
            ) * 100
        )
    );
}


/* =========================================================
   AUTENTICAÇÃO
========================================================= */

async function init(){

    try{

        const {
            data: sessionData,
            error: sessionError
        } =
        await supabaseClient
        .auth
        .getSession();


        if(sessionError)
            throw sessionError;


        if(!sessionData.session){

            window.location.replace(
                "login.html"
            );

            return;
        }


        currentUser =
            sessionData.session.user;


        const {
            data: weddings,
            error: weddingError
        } =
        await supabaseClient
        .from("weddings")
        .select("*")
        .eq("user_id",currentUser.id)
        .limit(1);


        if(weddingError)
            throw weddingError;


        if(
            !weddings ||
            !weddings.length
        ){

            showStatus(
                "Não foi encontrado um casamento associado à sua conta.",
                "error"
            );

            return;
        }


        currentWeddingId =
            weddings[0].id;


        await carregarDados();


    }catch(error){

        console.error(error);

        showStatus(
            "Erro ao iniciar o módulo: " +
            errorMessage(error),
            "error"
        );
    }
}


/* =========================================================
   CARREGAR DADOS
========================================================= */

async function carregarDados(){

    try{

        await Promise.all([
            carregarMesas(),
            carregarConvidados()
        ]);


        atualizarFiltros();
        render();


    }catch(error){

        console.error(error);

        showStatus(
            "Erro ao carregar dados: " +
            errorMessage(error),
            "error"
        );
    }
}


async function carregarMesas(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("tables")
    .select("*")
    .eq("wedding_id",currentWeddingId)
    .order("created_at",{ascending:true});


    if(error){

        console.error(
            "Erro ao carregar mesas:",
            error
        );

        throw error;
    }


    mesas =
        data || [];
}


async function carregarConvidados(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("guests")
    .select("*")
    .eq("wedding_id",currentWeddingId)
    .order("created_at",{ascending:true});


    if(error){

        console.error(
            "Erro ao carregar convidados:",
            error
        );

        throw error;
    }


    convidados =
        data || [];
}

            table.id;

            tableName(table);

function filteredGuests(){

    const q =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const rv =
        document.getElementById("rsvp")
        .value;


    const sd =
        document.getElementById("side")
        .value;


    const tp =
        document.getElementById("type")
        .value;


    const tf =
        document.getElementById("tableFilter")
        .value;


    return convidados.filter(g => {

        const searchText = [

            guestName(g),
            guestGroup(g),
            guestPhone(g),
            guestWhatsapp(g)

        ]
        .join(" ")
        .toLowerCase();


        return (

            (!q ||
                searchText.includes(q))

            &&

            (!rv ||
                guestRsvpValue(g) === rv)

            &&

            (!sd ||
                guestSideValue(g) === sd)

            &&

            (!tp ||
                guestTypeValue(g) === tp)

            &&

            (
                !tf ||
                (
                    tf === "none"
                        ? !guestTableId(g)
                        :
                        String(
                            guestTableId(g)
                        ) === String(tf)
                )
            )

        );
    });
}

/* =========================================================
   VALIDAR LUGAR
========================================================= */

function validarLugar(
    tableId,
    seatValue,
    ignoreGuestId=""
){

    if(!tableId)
        return true;


    const table =
        mesas.find(
            t =>
            String(t.id) ===
            String(tableId)
        );


    if(!table)
        return true;


    const capacity =
        tableCapacity(table);


    /*
     * Se foi indicado lugar,
     * validar o número.
     */

    if(seatValue){

        const seatNumber =
            Number(seatValue);


        if(
            seatNumber < 1 ||
            seatNumber > capacity
        ){

            showStatus(
                `O lugar deve estar entre 1 e ${capacity}.`,
                "error"
            );

            return false;
        }


        const occupied =
            convidados.some(g => {

                if(
                    String(g.id) ===
                    String(ignoreGuestId)
                )
                    return false;


                return (
                    String(
                        guestTableId(g)
                    ) ===
                    String(tableId)
                    &&
                    Number(
                        guestSeat(g)
                    ) ===
                    seatNumber
                );

            });


        if(occupied){

            showStatus(
                `O lugar ${seatNumber} dessa mesa já está ocupado.`,
                "error"
            );

            return false;
        }
    }


    /*
     * Verificar capacidade total.
     */

    let currentOccupancy =
        getTableOccupancy(tableId);


    if(ignoreGuestId){

        const oldGuest =
            convidados.find(
                g =>
                String(g.id) ===
                String(ignoreGuestId)
            );


        if(
            oldGuest &&
            String(
                guestTableId(oldGuest)
            ) ===
            String(tableId)
        ){

            currentOccupancy -=
                guestSeatCount(oldGuest);
        }
    }


    /*
     * O novo convidado ocupa
     * 1 ou 2 lugares.
     */

    const companion =
        document.getElementById(
            "companion"
        ).value === "Sim";


    const newOccupancy =
        currentOccupancy +
        (companion ? 2 : 1);


    if(
        newOccupancy >
        capacity
    ){

        showStatus(
            `A mesa "${tableName(table)}" não tem lugares suficientes. ` +
            `Restam ${Math.max(
                0,
                capacity - currentOccupancy
            )} lugar(es) disponível(is).`,
            "error"
        );

        return false;
    }


    return true;
}

document.getElementById(
    "tableForm"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!currentWeddingId){

            showStatus(
                "Casamento não identificado.",
                "error"
            );

            return;
        }


        const id =
            document.getElementById(
                "tableId"
            ).value;


        const name =
            document.getElementById(
                "tableName"
            )
            .value
            .trim();


        const capacity =
            Number(
                document.getElementById(
                    "capacity"
                ).value
            );


        const shape =
            document.getElementById(
                "shape"
            ).value;


        const location =
            document.getElementById(
                "location"
            )
            .value
            .trim();


        const notes =
            document.getElementById(
                "tableNotes"
            )
            .value
            .trim();


        if(!name){

            showStatus(
                "O nome/número da mesa é obrigatório.",
                "error"
            );

            return;
        }


        if(
            !Number.isFinite(capacity) ||
            capacity < 1
        ){

            showStatus(
                "A capacidade deve ser pelo menos 1.",
                "error"
            );

            return;
        }


        /*
         * Se estamos a editar,
         * não permitir capacidade inferior
         * à ocupação existente.
         */

        if(id){

            const occupied =
                getTableOccupancy(id);


            if(capacity < occupied){

                showStatus(
                    `Não é possível definir capacidade ${capacity}. ` +
                    `A mesa já possui ${occupied} lugar(es) ocupado(s). ` +
                    `Aumente a capacidade para pelo menos ${occupied}.`,
                    "error"
                );

                return;
            }
        }


        /*
         * IMPORTANTE:
         *
         * O ID da mesa NÃO é criado
         * pelo JavaScript.
         *
         * O Supabase gera o UUID.
         */

        const payload = {

            wedding_id:
                currentWeddingId,

            nome:
                name,

            formato:
                shape,

            capacidade:
                capacity,

            localizacao:
                location,

            notas:
                notes
        };


        const button =
            this.querySelector(
                'button[type="submit"]'
            );


        button.disabled = true;

        button.textContent =
            "A guardar...";


        try{

            let result;


            if(id){

                /*
                 * EDITAR
                 */

                result =
                    await supabaseClient
                    .from("tables")
                    .update(payload)
                    .eq("id",id)
                    .eq(
                        "wedding_id",
                        currentWeddingId
                    )
                    .select()
                    .single();


            }else{

                /*
                 * NOVA MESA
                 */

                result =
                    await supabaseClient
                    .from("tables")
                    .insert(payload)
                    .select()
                    .single();
            }


            /*
             * Se o Supabase devolveu erro,
             * mostrar o erro real.
             */

            if(result.error)
                throw result.error;


            /*
             * Confirmar que realmente
             * recebemos uma mesa.
             */

            if(!result.data){

                throw new Error(
                    "O Supabase não devolveu a mesa guardada."
                );
            }


            /*
             * Fechar modal.
             */

            document.getElementById(
                "tableModal"
            )
            .classList.remove("open");


            /*
             * Recarregar tudo do Supabase.
             *
             * Isto atualiza:
             * - mesas
             * - convidados
             * - ocupação
             * - lugares livres
             * - mapa
             */

            await carregarDados();


            showStatus(
                id
                    ? "Mesa atualizada com sucesso."
                    : "Mesa guardada com sucesso.",
                "success"
            );


        }catch(error){

            console.error(
                "ERRO AO GUARDAR MESA:",
                error
            );


            showStatus(
                "ERRO AO GUARDAR MESA: " +
                errorMessage(error),
                "error"
            );


        }finally{

            button.disabled = false;

            button.textContent =
                "Guardar mesa";
        }

    }
);


/* =========================================================
   ELIMINAR MESA
========================================================= */

async function delTable(id){

    const table =
        mesas.find(
            t =>
            String(t.id) ===
            String(id)
        );


    if(!table)
        return;


    const occupied =
        getTableOccupancy(id);


    let message =
        `Eliminar a mesa "${tableName(table)}"?`;


    if(occupied){

        message +=
            `\n\nExistem ${occupied} lugar(es) ocupado(s) nesta mesa.` +
            `\n\nOs convidados ficarão sem mesa.`;
    }


    if(!confirm(message))
        return;


    try{

        const {
            error
        } =
        await supabaseClient
        .from("tables")
        .delete()
        .eq("id",id)
        .eq(
            "wedding_id",
            currentWeddingId
        );


        if(error)
            throw error;


        /*
         * O FK guests.mesa_id possui
         * ON DELETE SET NULL.
         *
         * Portanto os convidados
         * deverão ficar sem mesa.
         */

        await carregarDados();


        showStatus(
            "Mesa eliminada com sucesso. Os convidados ficaram sem mesa.",
            "success"
        );


    }catch(error){

        console.error(
            "Erro ao eliminar mesa:",
            error
        );


        showStatus(
            "Erro ao eliminar mesa: " +
            errorMessage(error),
            "error"
        );
    }
}
