<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Casamento Perfeito</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8c8d8, #f4a9c4, #eeb5d0);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #5b3045;
        }

        /* Elementos decorativos */
        .decoracao {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bolha {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
        }

        .bolha-1 {
            width: 320px;
            height: 320px;
            top: -120px;
            left: -100px;
        }

        .bolha-2 {
            width: 420px;
            height: 420px;
            right: -180px;
            bottom: -180px;
        }

        /* Rosa */
        .rosa {
            position: absolute;
            left: 9%;
            top: 50%;
            transform: translateY(-50%);
            font-size: 145px;
            filter: drop-shadow(0 12px 15px rgba(92, 37, 62, 0.20));
            animation: flutuar 4s ease-in-out infinite;
        }

        /* Alianças */
        .aliancas {
            position: absolute;
            right: 10%;
            top: 14%;
            width: 180px;
            height: 100px;
            transform: rotate(-10deg);
        }

        .anel {
            position: absolute;
            width: 82px;
            height: 82px;
            border: 9px solid #d7a83e;
            border-radius: 50%;
            box-shadow:
                inset 0 0 8px rgba(255,255,255,0.9),
                0 5px 10px rgba(91, 53, 20, 0.18);
        }

        .anel::after {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            background: #fff5bd;
            border-radius: 50%;
            top: -8px;
            left: 29px;
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
        }

        .anel-1 {
            left: 20px;
            top: 7px;
        }

        .anel-2 {
            left: 70px;
            top: 7px;
        }

        /* Cartão */
        .login-card {
            position: relative;
            z-index: 5;
            width: min(440px, 92%);
            padding: 45px 42px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(91, 38, 62, 0.25);
            text-align: center;
        }

        .mini-rosa {
            font-size: 42px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 34px;
            color: #8f3157;
            margin-bottom: 8px;
        }

        .subtitulo {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #8a6876;
            margin-bottom: 30px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #71384f;
            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e7bfd0;
            border-radius: 12px;
            background: #fff8fb;
            color: #542d40;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .campo input:focus {
            border-color: #c85c85;
            box-shadow: 0 0 0 3px rgba(200, 92, 133, 0.12);
        }

        .opcoes {
            display: flex;
            justify-content: flex-end;
            margin: -5px 0 22px;
        }

        .opcoes a {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #a53d68;
            text-decoration: none;
        }

        .opcoes a:hover {
            text-decoration: underline;
        }

        .btn-entrar {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            background: linear-gradient(135deg, #c43f72, #9d315d);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(157, 49, 93, 0.25);
            transition: 0.3s;
        }

        .btn-entrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 11px 22px rgba(157, 49, 93, 0.32);
        }

        .registo {
            margin-top: 25px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #80616e;
        }

        .registo a {
            color: #a83262;
            font-weight: bold;
            text-decoration: none;
        }

        .registo a:hover {
            text-decoration: underline;
        }

        .voltar {
            display: inline-block;
            margin-top: 22px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #9a6377;
            text-decoration: none;
        }

        .voltar:hover {
            color: #8f3157;
        }

        @keyframes flutuar {
            0%, 100% {
                transform: translateY(-50%) rotate(-3deg);
            }

            50% {
                transform: translateY(-57%) rotate(3deg);
            }
        }

        /* Telemóveis */
        @media (max-width: 700px) {

            body {
                overflow-y: auto;
                padding: 30px 0;
            }

            .rosa {
                left: -20px;
                top: 8%;
                font-size: 85px;
                transform: none;
            }

            .aliancas {
                right: -25px;
                top: 7%;
                transform: scale(0.65) rotate(-10deg);
            }

            .login-card {
                width: 92%;
                padding: 35px 25px;
                margin-top: 55px;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <div class="decoracao">
        <div class="bolha bolha-1"></div>
        <div class="bolha bolha-2"></div>

        <!-- Rosa decorativa -->
        <div class="rosa">🌹</div>

        <!-- Par de alianças -->
        <div class="aliancas">
            <div class="anel anel-1"></div>
            <div class="anel anel-2"></div>
        </div>
    </div>

    <main class="login-card">

        <div class="mini-rosa">🌹</div>

        <h1>Bem-vindo de volta</h1>

        <p class="subtitulo">
            Entre na sua conta e continue a preparar<br>
            o seu momento perfeito.
        </p>

        <form>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite o seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="password">Palavra-passe</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite a sua palavra-passe"
                    required
                >
            </div>

            <div class="opcoes">
                <a href="#">Esqueceu-se da palavra-passe?</a>
            </div>

            <button type="submit" class="btn-entrar">
                Entrar
            </button>

        </form>

        <p class="registo">
            Ainda não tem uma conta?
            <a href="registo.html">Criar conta</a>
        </p>

        <a href="index.html" class="voltar">
            ← Voltar à página inicial
        </a>

    </main>

</body>
</html>
