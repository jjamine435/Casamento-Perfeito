<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Casamento Perfeito</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff4f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .login-card {
            width: 920px;
            max-width: 100%;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .login-side {
            padding: 45px;
        }

        .menu {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-bottom: 35px;
        }

        .menu a {
            text-decoration: none;
            color: #9b596f;
            font-size: 14px;
        }

        .logo {
            color: #c66b88;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        h1 {
            color: #4b3039;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #4b3039;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #e4cbd3;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c66b88;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #777;
        }

        .remember input {
            width: auto;
        }

        .forgot {
            color: #c66b88;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #c66b88;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b45877;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            line-height: 1.4;
        }

        .success {
            background: #e9f8ee;
            color: #26723d;
        }

        .error {
            background: #fdebed;
            color: #a33a48;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .register-link a {
            color: #c66b88;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #999;
            text-decoration: none;
            font-size: 13px;
        }

        .image-side {
            min-height: 650px;
            position: relative;
            overflow: hidden;
        }

        .image-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 35px 30px;
            color: white;
            background: linear-gradient(
                transparent,
                rgba(0,0,0,0.65)
            );
        }

        .image-overlay h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .image-overlay p {
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 750px) {

            .login-card {
                grid-template-columns: 1fr;
            }

            .image-side {
                display: none;
            }

            .login-side {
                padding: 30px 25px;
            }

        }

    </style>
</head>

<body>

<div class="login-card">

    <section class="login-side">

        <div class="menu">
            <a href="login.html">Entrar</a>
            <a href="registo.html">Criar conta</a>
        </div>

        <div class="logo">
            💕 Casamento Perfeito
        </div>

        <h1>Bem-vindo de volta</h1>

        <p class="subtitle">
            Entre na sua conta e continue a planear
            o seu grande dia.
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="exemplo@email.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Palavra-passe
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite a sua palavra-passe"
                    required
                >

            </div>

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Lembrar-me

                </label>

                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >
                    Esqueceu a palavra-passe?
                </a>

            </div>

            <button type="submit">
                Entrar
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>

        <div class="register-link">

            Ainda não tem uma conta?

            <a href="registo.html">
                Criar conta
            </a>

        </div>

        <a
            class="back-home"
            href="index.html"
        >
            ← Voltar à página inicial
        </a>

    </section>


    <section class="image-side">

        <img
            src="./images/rosinha.jpg"
            alt="Imagem romântica do Casamento Perfeito"
        >

        <div class="image-overlay">

            <h2>
                O amor está nos detalhes
            </h2>

            <p>
                Planeie cada momento do seu grande dia.
            </p>

        </div>

    </section>

</div>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    message.style.display = "none";
    message.className = "message";


    const utilizadores =
        JSON.parse(
            localStorage.getItem(
                "casamentoPerfeitoUtilizadores"
            )
        ) || [];


    const utilizador =
        utilizadores.find(function(user) {

            return (
                user.email === email &&
                user.password === password
            );

        });


    if (!utilizador) {

        message.textContent =
            "E-mail ou palavra-passe incorrectos.";

        message.classList.add("error");

        message.style.display = "block";

        return;
    }


    localStorage.setItem(
        "casamentoPerfeitoSessao",
        JSON.stringify({
            nome: utilizador.nome,
            email: utilizador.email
        })
    );


    message.textContent =
        "Login efectuado com sucesso! A entrar...";

    message.classList.add("success");

    message.style.display = "block";


    setTimeout(function() {

        window.location.href =
            "dashboard.html";

    }, 1000);

});


document
.getElementById("forgotPassword")
.addEventListener("click", function(event) {

    event.preventDefault();

    alert(
        "A recuperação da palavra-passe será implementada numa próxima etapa."
    );

});

</script>

</body>
</html>
