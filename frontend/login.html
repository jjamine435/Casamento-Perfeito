<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Casamento Perfeito</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(255,255,255,.9), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(255,180,200,.35), transparent 40%),
                #f7eeee;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* CONTAINER PRINCIPAL */

        .login-container {
            width: min(1000px, 95vw);
            min-height: 560px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(80, 40, 40, .15);
        }


        /* =========================
           LADO DA FOTOGRAFIA
        ========================= */

        .photo-side {

            position: relative;

            min-height: 560px;

            background-image: url("https://images.openai.com/static-rsc-4/gyEF_huyo9G13Jewi0V_kWAL2R3tije8Q_CJfJ1SqiwjU-EQnSOX3sKAdR5OhuGSJuIShQ5vU66wnNyg2XdhxacN_gu6BwoCeSfsjutBDxz1XPruOu5wJmNHpJnyOu9GvF5SOYnwUWgAXaPjrcxtaluqtXql-RBU1Sbx9uN3Pts?purpose=inline");

            background-size: cover;

            background-position: center;
        }


        /* ligeiro efeito sobre a fotografia */

        .photo-side::after {

            content: "";

            position: absolute;

            inset: 0;

            background: linear-gradient(
                to bottom,
                rgba(255,255,255,.03),
                rgba(255,255,255,.08)
            );
        }


        /* =========================
           LADO DO LOGIN
        ========================= */

        .form-side {

            background: #ffffff;

            padding: 38px 60px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        /* =========================
           MENU
        ========================= */

        .top-menu {

            display: flex;

            gap: 32px;

            margin-bottom: 62px;

            font-size: 14px;
        }

        .top-menu a {

            text-decoration: none;

            color: #333;

            padding-bottom: 8px;

            position: relative;
        }

        .top-menu a.active {

            font-weight: 600;
        }

        .top-menu a.active::after {

            content: "";

            position: absolute;

            left: 0;

            right: 0;

            bottom: 0;

            height: 2px;

            background: #e7b8b0;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            margin-bottom: 13px;
        }

        .logo h1 {

            font-family: Georgia, "Times New Roman", serif;

            font-size: 27px;

            font-weight: bold;

            color: #c44f65;

            letter-spacing: -1px;
        }

        .logo span {

            color: #777;

            font-size: 11px;

            letter-spacing: 1px;
        }


        /* =========================
           TEXTO
        ========================= */

        .intro {

            text-align: center;

            color: #777;

            font-size: 10px;

            line-height: 1.6;

            margin-bottom: 27px;
        }


        /* =========================
           FORMULÁRIO
        ========================= */

        .form-group {

            margin-bottom: 14px;
        }

        .form-group label {

            display: block;

            font-size: 9px;

            font-weight: bold;

            color: #555;

            margin-bottom: 7px;

            text-transform: uppercase;
        }

        .form-group input {

            width: 100%;

            height: 40px;

            border: 1px solid #e4e4e4;

            border-radius: 5px;

            padding: 0 12px;

            font-size: 11px;

            outline: none;

            background: #fff;
        }

        .form-group input:focus {

            border-color: #e8b6ae;

            box-shadow: 0 0 0 2px rgba(232,182,174,.12);
        }


        /* =========================
           ESQUECEU PASSWORD
        ========================= */

        .forgot {

            text-align: right;

            margin-top: -4px;

            margin-bottom: 18px;
        }

        .forgot a {

            color: #444;

            font-size: 9px;

            text-decoration: none;
        }


        /* =========================
           BOTÃO LOGIN
        ========================= */

        .login-button {

            width: 100%;

            height: 40px;

            border: none;

            border-radius: 5px;

            background: #f2c9c1;

            color: #513b37;

            font-size: 11px;

            cursor: pointer;

            transition: .2s;
        }

        .login-button:hover {

            background: #eab6ad;
        }


        /* =========================
           OR
        ========================= */

        .or {

            text-align: center;

            margin: 16px 0;

            color: #999;

            font-size: 9px;
        }


        /* =========================
           FACEBOOK
        ========================= */

        .facebook {

            width: 100%;

            height: 38px;

            border: 1px solid #dedede;

            background: white;

            border-radius: 5px;

            font-size: 9px;

            color: #444;

            cursor: pointer;
        }

        .facebook:hover {

            background: #fafafa;
        }


        /* =========================
           TERMOS
        ========================= */

        .terms {

            text-align: center;

            font-size: 8px;

            color: #888;

            line-height: 1.5;

            margin-top: 15px;
        }

        .terms a {

            color: #555;

            text-decoration: none;

            font-weight: bold;
        }


        /* =========================
           REGISTO
        ========================= */

        .signup {

            text-align: center;

            border-top: 1px solid #eeeeee;

            margin-top: 18px;

            padding-top: 18px;

            font-size: 9px;

            color: #777;
        }

        .signup a {

            color: #444;

            text-decoration: none;

            font-weight: bold;
        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 750px) {

            body {
                padding: 20px;
            }

            .login-container {

                grid-template-columns: 1fr;

                width: 100%;

                max-width: 450px;
            }

            .photo-side {

                min-height: 280px;

                height: 280px;
            }

            .form-side {

                padding: 35px 30px 40px;
            }

            .top-menu {

                margin-bottom: 35px;
            }
        }


        @media (max-width: 450px) {

            .photo-side {

                min-height: 220px;

                height: 220px;
            }

            .form-side {

                padding: 30px 24px;
            }

            .top-menu {

                gap: 24px;
            }
        }

    </style>
</head>


<body>

    <div class="login-container">


        <!-- =========================
             FOTOGRAFIA
        ========================== -->

        <div class="photo-side"></div>


        <!-- =========================
             FORMULÁRIO
        ========================== -->

        <div class="form-side">


            <div class="top-menu">

                <a href="login.html" class="active">
                    Login
                </a>

                <a href="registo.html">
                    Signup
                </a>

            </div>


            <div class="logo">

                <h1>Casamento Perfeito</h1>

                <span>O seu grande dia começa aqui</span>

            </div>


            <p class="intro">

                Introduza os seus dados abaixo para<br>
                entrar na sua conta.

            </p>


            <form>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite o seu e-mail"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Palavra-passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="A sua palavra-passe"
                        required
                    >

                </div>


                <div class="forgot">

                    <a href="#">
                        Esqueceu-se da palavra-passe?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>


                <div class="or">
                    OU
                </div>


                <button
                    type="button"
                    class="facebook"
                >
                    🔵 &nbsp; Entrar com Facebook
                </button>


                <div class="terms">

                    Ao continuar, aceita os nossos

                    <a href="#">
                        Termos de Serviço
                    </a>

                    e

                    <a href="#">
                        Política de Privacidade
                    </a>.

                </div>


                <div class="signup">

                    Ainda não tem uma conta?

                    <a href="registo.html">
                        Criar conta
                    </a>

                </div>


            </form>

        </div>

    </div>

</body>
</html>
