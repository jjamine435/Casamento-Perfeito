<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planeador | Casamento Perfeito</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f7f5;
            color: #333;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e8e4df;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #8b5e5e;
        }

        .back-link {
            text-decoration: none;
            color: #8b5e5e;
            font-weight: 600;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #777;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e7e2dd;
            border-radius: 12px;
            padding: 20px;
        }

        .summary-card span {
            display: block;
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-card strong {
            font-size: 28px;
            color: #8b5e5e;
        }

        .progress-container {
            background: #e9e5e1;
            height: 9px;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #8b5e5e;
            transition: width .3s ease;
        }

        .layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .categories,
        .tasks-panel {
            background: white;
            border: 1px solid #e7e2dd;
            border-radius: 12px;
        }

        .categories {
            padding: 15px;
        }

        .categories h3 {
            margin-bottom: 12px;
        }

        .category-btn {
            width: 100%;
            border: none;
            background: transparent;
            padding: 11px 12px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 3px;
            font-size: 14px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #f1e8e5;
            color: #8b5e5e;
            font-weight: bold;
        }

        .tasks-panel {
            padding: 20px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input,
        select,
        textarea {
            border: 1px solid #ddd5cf;
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14px;
        }

        #search {
            flex: 1;
            min-width: 220px;
        }

        button {
            font-family: inherit;
        }

        .primary-btn {
            border: none;
            background: #8b5e5e;
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .secondary-btn {
            border: 1px solid #ddd5cf;
            background: white;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .task {
            border: 1px solid #e7e2dd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .task.completed {
            background: #f7f7f7;
        }

        .task.completed .task-title {
            text-decoration: line-through;
            color: #999;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .task-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #777;
        }

        .priority {
            padding: 3px 7px;
            border-radius: 10px;
            background: #eee;
        }

        .priority.alta {
            background: #f6dddd;
            color: #9b3030;
        }

        .priority.media {
            background: #f5ecd3;
            color: #80651a;
        }

        .priority.baixa {
            background: #dceee1;
            color: #316b3d;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #888;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 14px;
            padding: 25px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .reports {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .reports h3 {
            margin-bottom: 12px;
        }

        .report-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .container {
                padding: 0 12px;
            }
        }

        @media print {
            header,
            .categories,
            .toolbar,
            .reports,
            .modal {
                display: none !important;
            }

            body {
                background: white;
            }

            .layout {
                display: block;
            }

            .tasks-panel {
                border: none;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">💍 Casamento Perfeito</div>
    <a href="dashboard.html" class="back-link">← Voltar ao Dashboard</a>
</header>

<main class="container">

    <div class="page-title">
        <h1>Planeador do Casamento</h1>
        <p>Organize cada detalhe do seu grande dia num único lugar.</p>
    </div>

    <section class="summary">

        <div class="summary-card">
            <span>Total de tarefas</span>
            <strong id="totalTasks">0</strong>
        </div>

        <div class="summary-card">
            <span>Concluídas</span>
            <strong id="completedTasks">0</strong>
        </div>

        <div class="summary-card">
            <span>Pendentes</span>
            <strong id="pendingTasks">0</strong>
        </div>

        <div class="summary-card">
            <span>Progresso</span>
            <strong id="progressText">0%</strong>

            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

    </section>

    <section class="layout">

        <aside class="categories">

            <h3>Categorias</h3>

            <button class="category-btn active" data-category="Geral">📋 Geral</button>
            <button class="category-btn" data-category="Noivo">🤵 Noivo</button>
            <button class="category-btn" data-category="Noiva">👰 Noiva</button>
            <button class="category-btn" data-category="Notarial">📄 Notarial / Civil</button>
            <button class="category-btn" data-category="Religioso">⛪ Religioso</button>
            <button class="category-btn" data-category="Salao">🏛️ Salão / Local</button>
            <button class="category-btn" data-category="Decoracao">💐 Decoração</button>
            <button class="category-btn" data-category="Catering">🍽️ Catering</button>
            <button class="category-btn" data-category="Fotografia">📸 Foto / Vídeo</button>
            <button class="category-btn" data-category="Musica">🎶 Música / DJ</button>
            <button class="category-btn" data-category="Aliancas">💍 Alianças</button>
            <button class="category-btn" data-category="Convites">💌 Convites</button>
            <button class="category-btn" data-category="Familia">👨‍👩‍👧 Família / Padrinhos</button>
            <button class="category-btn" data-category="Transporte">🚗 Transporte</button>
            <button class="category-btn" data-category="Lua">✈️ Lua de Mel</button>
            <button class="category-btn" data-category="Financeiro">💰 Financeiro</button>

        </aside>

        <section class="tasks-panel">

            <div class="toolbar">

                <input
                    type="search"
                    id="search"
                    placeholder="Pesquisar tarefa..."
                >

                <select id="statusFilter">
                    <option value="todos">Todos os estados</option>
                    <option value="pendente">Pendentes</option>
                    <option value="concluida">Concluídas</option>
                </select>

                <button class="primary-btn" id="addTask">
                    + Nova tarefa
                </button>

            </div>

            <div id="taskList"></div>

            <div class="reports">

                <h3>📊 Relatórios</h3>

                <div class="report-buttons">

                    <button class="secondary-btn" id="excelBtn">
                        📗 Excel (.xlsx)
                    </button>

                    <button class="secondary-btn" id="pdfBtn">
                        📕 PDF
                    </button>

                    <button class="secondary-btn" id="csvBtn">
                        📄 CSV
                    </button>

                    <button class="secondary-btn" id="printBtn">
                        🖨️ Imprimir
                    </button>

                </div>

            </div>

        </section>

    </section>

</main>


<div class="modal" id="taskModal">

    <div class="modal-content">

        <h2>Nova tarefa</h2>

        <form id="taskForm">

            <div class="form-grid">

                <div class="form-group full">

                    <label for="taskName">
                        Tarefa
                    </label>

                    <input
                        type="text"
                        id="taskName"
                        required
                        placeholder="Ex.: Reservar salão"
                    >

                </div>

                <div class="form-group">

                    <label for="taskCategory">
                        Categoria
                    </label>

                    <select id="taskCategory">

                        <option>Geral</option>
                        <option>Noivo</option>
                        <option>Noiva</option>
                        <option>Notarial</option>
                        <option>Religioso</option>
                        <option>Salao</option>
                        <option>Decoracao</option>
                        <option>Catering</option>
                        <option>Fotografia</option>
                        <option>Musica</option>
                        <option>Aliancas</option>
                        <option>Convites</option>
                        <option>Familia</option>
                        <option>Transporte</option>
                        <option>Lua</option>
                        <option>Financeiro</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="taskResponsible">
                        Responsável
                    </label>

                    <select id="taskResponsible">

                        <option>Casal</option>
                        <option>Noivo</option>
                        <option>Noiva</option>
                        <option>Família</option>
                        <option>Padrinhos</option>
                        <option>Fornecedor</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="taskDate">
                        Prazo
                    </label>

                    <input
                        type="date"
                        id="taskDate"
                    >

                </div>

                <div class="form-group">

                    <label for="taskPriority">
                        Prioridade
                    </label>

                    <select id="taskPriority">

                        <option value="Alta">Alta</option>
                        <option value="Média" selected>Média</option>
                        <option value="Baixa">Baixa</option>

                    </select>

                </div>

                <div class="form-group full">

                    <label for="taskNotes">
                        Notas
                    </label>

                    <textarea
                        id="taskNotes"
                        rows="4"
                        placeholder="Observações..."
                    ></textarea>

                </div>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelTask"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Adicionar tarefa
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    const defaultTasks = [

        {
            title: "Definir a data do casamento",
            category: "Geral",
            responsible: "Casal",
            date: "",
            priority: "Alta",
            notes: "",
            completed: false
        },

        {
            title: "Definir o orçamento geral",
            category: "Geral",
            responsible: "Casal",
            date: "",
            priority: "Alta",
            notes: "",
            completed: false
        },

        {
            title: "Escolher o local da cerimónia",
            category: "Religioso",
            responsible: "Casal",
            date: "",
            priority: "Alta",
            notes: "",
            completed: false
        },

        {
            title: "Escolher o salão",
            category: "Salao",
            responsible: "Casal",
            date: "",
            priority: "Alta",
            notes: "",
            completed: false
        },

        {
            title: "Escolher o vestido",
            category: "Noiva",
            responsible: "Noiva",
            date: "",
            priority: "Alta",
            notes: "",
            completed: false
        },

        {
            title: "Escolher o fato",
            category: "Noivo",
            responsible: "Noivo",
            date: "",
            priority: "Alta",
            notes: "",
            completed: false
        },

        {
            title: "Verificar documentação civil",
            category: "Notarial",
            responsible: "Casal",
            date: "",
            priority: "Alta",
            notes: "",
            completed: false
        },

        {
            title: "Escolher fotógrafo",
            category: "Fotografia",
            responsible: "Casal",
            date: "",
            priority: "Média",
            notes: "",
            completed: false
        },

        {
            title: "Escolher música ou DJ",
            category: "Musica",
            responsible: "Casal",
            date: "",
            priority: "Média",
            notes: "",
            completed: false
        },

        {
            title: "Escolher alianças",
            category: "Aliancas",
            responsible: "Casal",
            date: "",
            priority: "Alta",
            notes: "",
            completed: false
        }

    ];

    let tasks = [...defaultTasks];

    let currentCategory = "Geral";

    const taskList = document.getElementById("taskList");
    const search = document.getElementById("search");
    const statusFilter = document.getElementById("statusFilter");

    function renderTasks() {

        const searchText = search.value.toLowerCase();

        const status = statusFilter.value;

        const filtered = tasks.filter(task => {

            const categoryMatch =
                task.category === currentCategory;

            const searchMatch =
                task.title.toLowerCase().includes(searchText);

            const statusMatch =
                status === "todos" ||
                (status === "concluida" && task.completed) ||
                (status === "pendente" && !task.completed);

            return categoryMatch && searchMatch && statusMatch;

        });

        if (filtered.length === 0) {

            taskList.innerHTML = `
                <div class="empty">
                    Nenhuma tarefa encontrada nesta categoria.
                </div>
            `;

            return;
        }

        taskList.innerHTML = filtered.map((task, index) => {

            const realIndex = tasks.indexOf(task);

            return `

                <div class="task ${task.completed ? "completed" : ""}">

                    <input
                        type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${realIndex})"
                    >

                    <div class="task-info">

                        <div class="task-title">
                            ${escapeHTML(task.title)}
                        </div>

                        <div class="task-meta">

                            <span>
                                👤 ${escapeHTML(task.responsible)}
                            </span>

                            <span>
                                📅 ${task.date || "Sem prazo"}
                            </span>

                            <span class="priority ${priorityClass(task.priority)}">
                                ${escapeHTML(task.priority)}
                            </span>

                        </div>

                    </div>

                </div>

            `;

        }).join("");

    }

    function toggleTask(index) {

        tasks[index].completed =
            !tasks[index].completed;

        updateSummary();

        renderTasks();

    }

    function updateSummary() {

        const total = tasks.length;

        const completed =
            tasks.filter(task => task.completed).length;

        const pending =
            total - completed;

        const progress =
            total === 0
                ? 0
                : Math.round((completed / total) * 100);

        document.getElementById("totalTasks").textContent = total;

        document.getElementById("completedTasks").textContent =
            completed;

        document.getElementById("pendingTasks").textContent =
            pending;

        document.getElementById("progressText").textContent =
            progress + "%";

        document.getElementById("progressBar").style.width =
            progress + "%";

    }

    function priorityClass(priority) {

        if (priority === "Alta") return "alta";

        if (priority === "Média") return "media";

        return "baixa";

    }

    function escapeHTML(text) {

        return text
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }

    document
        .querySelectorAll(".category-btn")
        .forEach(button => {

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(".category-btn")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                button.classList.add("active");

                currentCategory =
                    button.dataset.category;

                renderTasks();

            });

        });


    search.addEventListener(
        "input",
        renderTasks
    );

    statusFilter.addEventListener(
        "change",
        renderTasks
    );


    const modal =
        document.getElementById("taskModal");

    document
        .getElementById("addTask")
        .addEventListener("click", () => {

            modal.classList.add("show");

        });


    document
        .getElementById("cancelTask")
        .addEventListener("click", () => {

            modal.classList.remove("show");

        });


    document
        .getElementById("taskForm")
        .addEventListener("submit", event => {

            event.preventDefault();

            const newTask = {

                title:
                    document.getElementById("taskName").value,

                category:
                    document.getElementById("taskCategory").value,

                responsible:
                    document.getElementById("taskResponsible").value,

                date:
                    document.getElementById("taskDate").value,

                priority:
                    document.getElementById("taskPriority").value,

                notes:
                    document.getElementById("taskNotes").value,

                completed: false

            };

            tasks.push(newTask);

            event.target.reset();

            modal.classList.remove("show");

            currentCategory = newTask.category;

            document
                .querySelectorAll(".category-btn")
                .forEach(btn => {

                    btn.classList.toggle(
                        "active",
                        btn.dataset.category === currentCategory
                    );

                });

            updateSummary();

            renderTasks();

        });


    document
        .getElementById("printBtn")
        .addEventListener("click", () => {

            window.print();

        });


    document
        .getElementById("csvBtn")
        .addEventListener("click", () => {

            const header =
                "Categoria,Tarefa,Responsável,Prazo,Prioridade,Estado,Notas\n";

            const rows = tasks.map(task => {

                return [

                    task.category,
                    task.title,
                    task.responsible,
                    task.date,
                    task.priority,
                    task.completed
                        ? "Concluída"
                        : "Pendente",
                    task.notes

                ]
                .map(value =>
                    `"${String(value).replaceAll('"', '""')}"`
                )
                .join(",");

            }).join("\n");

            downloadFile(
                header + rows,
                "relatorio-planeador.csv",
                "text/csv;charset=utf-8;"
            );

        });


    function downloadFile(
        content,
        filename,
        type
    ) {

        const blob =
            new Blob([content], { type });

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;

        link.download = filename;

        link.click();

        URL.revokeObjectURL(url);

    }


    document
        .getElementById("excelBtn")
        .addEventListener("click", () => {

            alert(
                "A exportação Excel será activada na próxima etapa."
            );

        });


    document
        .getElementById("pdfBtn")
        .addEventListener("click", () => {

            alert(
                "A exportação PDF será activada na próxima etapa."
            );

        });


    updateSummary();

    renderTasks();

</script>

</body>
</html>
