<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planeador | Casamento Perfeito</title>

    <!-- Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #8b5e5e;
            --primary-light: #f3e8e5;
            --background: #faf8f6;
            --white: #ffffff;
            --border: #e8e1dc;
            --text: #333333;
            --muted: #777777;
            --success: #3d7a4a;
            --danger: #a33a3a;
            --warning: #8a6b20;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: var(--muted);
        }

        /* =========================
           SUMMARY
        ========================= */

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .summary-card span {
            display: block;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-card strong {
            font-size: 28px;
            color: var(--primary);
        }

        .progress-container {
            background: #e9e4df;
            height: 9px;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width .3s ease;
        }

        /* =========================
           LAYOUT
        ========================= */

        .layout {
            display: grid;
            grid-template-columns: 270px 1fr;
            gap: 20px;
        }

        .categories,
        .tasks-panel {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        /* =========================
           CATEGORIES
        ========================= */

        .categories {
            padding: 15px;
            height: fit-content;
        }

        .categories h3 {
            margin-bottom: 12px;
            padding: 5px;
        }

        .category-btn {
            width: 100%;
            border: none;
            background: transparent;

            padding: 11px 12px;

            text-align: left;

            border-radius: 8px;

            cursor: pointer;

            margin-bottom: 3px;

            font-size: 14px;

            color: var(--text);
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: bold;
        }

        /* =========================
           TASK PANEL
        ========================= */

        .tasks-panel {
            padding: 20px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input,
        select,
        textarea {
            border: 1px solid #ddd5cf;
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14px;
            font-family: inherit;
        }

        #search {
            flex: 1;
            min-width: 220px;
        }

        button {
            font-family: inherit;
        }

        .primary-btn {
            border: none;
            background: var(--primary);
            color: white;

            padding: 11px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .primary-btn:hover {
            opacity: .9;
        }

        .secondary-btn {
            border: 1px solid #ddd5cf;
            background: white;

            padding: 11px 16px;

            border-radius: 8px;

            cursor: pointer;
        }

        .secondary-btn:hover {
            background: #faf7f5;
        }

        /* =========================
           TASK
        ========================= */

        .task {
            border: 1px solid var(--border);
            border-radius: 10px;

            padding: 15px;

            margin-bottom: 10px;

            display: flex;
            gap: 12px;

            align-items: flex-start;

            transition: .2s;
        }

        .task:hover {
            border-color: #d6c7bf;
        }

        .task.completed {
            background: #f7f7f7;
        }

        .task.completed .task-title {
            text-decoration: line-through;
            color: #999;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            margin-top: 3px;
            cursor: pointer;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .task-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;

            font-size: 12px;
            color: var(--muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            background: #f1efed;
        }

        .priority-alta {
            background: #f6dddd;
            color: var(--danger);
        }

        .priority-media {
            background: #f5ecd3;
            color: var(--warning);
        }

        .priority-baixa {
            background: #dceee1;
            color: var(--success);
        }

        .task-actions {
            display: flex;
            gap: 5px;
        }

        .delete-btn {
            border: none;
            background: transparent;

            cursor: pointer;

            font-size: 17px;

            padding: 5px;
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        .empty {
            padding: 50px;
            text-align: center;
            color: var(--muted);
        }

        /* =========================
           CATEGORY PROGRESS
        ========================= */

        .category-progress {
            margin-bottom: 20px;
            padding: 15px;

            background: #fcfaf9;

            border: 1px solid var(--border);

            border-radius: 10px;
        }

        .category-progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;

            font-size: 14px;
        }

        .mini-progress {
            height: 7px;
            background: #e9e4df;
            border-radius: 20px;
            overflow: hidden;
        }

        .mini-progress div {
            height: 100%;
            background: var(--primary);
        }

        /* =========================
           REPORTS
        ========================= */

        .reports {
            margin-top: 25px;
            padding-top: 20px;

            border-top: 1px solid #eee;
        }

        .reports h3 {
            margin-bottom: 12px;
        }

        .report-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.45);

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;

            width: 100%;
            max-width: 650px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 14px;

            padding: 25px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;

            gap: 6px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 950px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .layout {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            .container {
                padding: 0 12px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .page-title h1 {
                font-size: 26px;
            }

        }

        /* =========================
           PRINT
        ========================= */

        @media print {

            header,
            .categories,
            .toolbar,
            .reports,
            .task-actions {
                display: none !important;
            }

            body {
                background: white;
            }

            .layout {
                display: block;
            }

            .tasks-panel {
                border: none;
            }

            .category-progress {
                display: none;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        💍 Casamento Perfeito
    </div>

    <a
        href="dashboard.html"
        class="back-link"
    >
        ← Voltar ao Dashboard
    </a>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            Planeador do Casamento
        </h1>

        <p>
            Organize cada detalhe do seu grande dia num único lugar.
        </p>

    </div>


    <!-- =========================
         RESUMO
    ========================= -->

    <section class="summary">

        <div class="summary-card">

            <span>
                Total de tarefas
            </span>

            <strong id="totalTasks">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Concluídas
            </span>

            <strong id="completedTasks">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Pendentes
            </span>

            <strong id="pendingTasks">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Progresso geral
            </span>

            <strong id="progressText">
                0%
            </strong>

            <div class="progress-container">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

        </div>

    </section>


    <!-- =========================
         LAYOUT
    ========================= -->

    <section class="layout">


        <!-- CATEGORIAS -->

        <aside class="categories">

            <h3>
                Categorias
            </h3>


            <button
                class="category-btn active"
                data-category="Todas"
            >
                📋 Todas
            </button>

            <button
                class="category-btn"
                data-category="Geral"
            >
                📌 Geral
            </button>

            <button
                class="category-btn"
                data-category="Noivo"
            >
                🤵 Noivo
            </button>

            <button
                class="category-btn"
                data-category="Noiva"
            >
                👰 Noiva
            </button>

            <button
                class="category-btn"
                data-category="Notarial"
            >
                📄 Notarial / Civil
            </button>

            <button
                class="category-btn"
                data-category="Religioso"
            >
                ⛪ Religioso
            </button>

            <button
                class="category-btn"
                data-category="Salao"
            >
                🏛️ Salão / Local
            </button>

            <button
                class="category-btn"
                data-category="Decoracao"
            >
                💐 Decoração
            </button>

            <button
                class="category-btn"
                data-category="Catering"
            >
                🍽️ Catering
            </button>

            <button
                class="category-btn"
                data-category="Fotografia"
            >
                📸 Fotografia / Vídeo
            </button>

            <button
                class="category-btn"
                data-category="Musica"
            >
                🎶 Música / DJ
            </button>

            <button
                class="category-btn"
                data-category="Aliancas"
            >
                💍 Alianças
            </button>

            <button
                class="category-btn"
                data-category="Convites"
            >
                💌 Convites
            </button>

            <button
                class="category-btn"
                data-category="Familia"
            >
                👨‍👩‍👧 Família / Padrinhos
            </button>

            <button
                class="category-btn"
                data-category="Transporte"
            >
                🚗 Transporte
            </button>

            <button
                class="category-btn"
                data-category="Lua"
            >
                ✈️ Lua de Mel
            </button>

            <button
                class="category-btn"
                data-category="Financeiro"
            >
                💰 Financeiro
            </button>

        </aside>


        <!-- TAREFAS -->

        <section class="tasks-panel">


            <div class="toolbar">

                <input
                    type="search"
                    id="search"
                    placeholder="🔎 Pesquisar tarefa..."
                >


                <select id="statusFilter">

                    <option value="todos">
                        Todos os estados
                    </option>

                    <option value="pendente">
                        Pendentes
                    </option>

                    <option value="concluida">
                        Concluídas
                    </option>

                </select>


                <select id="priorityFilter">

                    <option value="todas">
                        Todas as prioridades
                    </option>

                    <option value="Alta">
                        Alta
                    </option>

                    <option value="Média">
                        Média
                    </option>

                    <option value="Baixa">
                        Baixa
                    </option>

                </select>


                <button
                    class="primary-btn"
                    id="addTask"
                >
                    + Nova tarefa
                </button>

            </div>


            <!-- PROGRESSO DA CATEGORIA -->

            <div
                id="categoryProgress"
                class="category-progress"
            ></div>


            <!-- LISTA -->

            <div id="taskList"></div>


            <!-- RELATÓRIOS -->

            <div class="reports">

                <h3>
                    📊 Relatórios
                </h3>

                <div class="report-buttons">

                    <button
                        class="secondary-btn"
                        id="excelBtn"
                    >
                        📗 Excel
                    </button>

                    <button
                        class="secondary-btn"
                        id="csvBtn"
                    >
                        📄 CSV
                    </button>

                    <button
                        class="secondary-btn"
                        id="pdfBtn"
                    >
                        📕 PDF
                    </button>

                    <button
                        class="secondary-btn"
                        id="printBtn"
                    >
                        🖨️ Imprimir
                    </button>

                </div>

            </div>

        </section>

    </section>

</main>


<!-- =========================
     MODAL NOVA TAREFA
========================= -->

<div
    class="modal"
    id="taskModal"
>

    <div class="modal-content">

        <h2>
            Nova tarefa
        </h2>


        <form id="taskForm">

            <div class="form-grid">


                <div class="form-group full">

                    <label>
                        Tarefa
                    </label>

                    <input
                        type="text"
                        id="taskName"
                        required
                        placeholder="Ex.: Reservar salão"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Categoria
                    </label>

                    <select id="taskCategory">

                        <option value="Geral">
                            Geral
                        </option>

                        <option value="Noivo">
                            Noivo
                        </option>

                        <option value="Noiva">
                            Noiva
                        </option>

                        <option value="Notarial">
                            Notarial / Civil
                        </option>

                        <option value="Religioso">
                            Religioso
                        </option>

                        <option value="Salao">
                            Salão / Local
                        </option>

                        <option value="Decoracao">
                            Decoração
                        </option>

                        <option value="Catering">
                            Catering
                        </option>

                        <option value="Fotografia">
                            Fotografia / Vídeo
                        </option>

                        <option value="Musica">
                            Música / DJ
                        </option>

                        <option value="Aliancas">
                            Alianças
                        </option>

                        <option value="Convites">
                            Convites
                        </option>

                        <option value="Familia">
                            Família / Padrinhos
                        </option>

                        <option value="Transporte">
                            Transporte
                        </option>

                        <option value="Lua">
                            Lua de Mel
                        </option>

                        <option value="Financeiro">
                            Financeiro
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Responsável
                    </label>

                    <select id="taskResponsible">

                        <option>
                            Casal
                        </option>

                        <option>
                            Noivo
                        </option>

                        <option>
                            Noiva
                        </option>

                        <option>
                            Família
                        </option>

                        <option>
                            Padrinhos
                        </option>

                        <option>
                            Fornecedor
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Prazo
                    </label>

                    <input
                        type="date"
                        id="taskDate"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Prioridade
                    </label>

                    <select id="taskPriority">

                        <option value="Alta">
                            Alta
                        </option>

                        <option
                            value="Média"
                            selected
                        >
                            Média
                        </option>

                        <option value="Baixa">
                            Baixa
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Notas
                    </label>

                    <textarea
                        id="taskNotes"
                        rows="4"
                        placeholder="Observações..."
                    ></textarea>

                </div>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelTask"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Adicionar tarefa
                </button>

            </div>

        </form>

    </div>

</div>

/* =========================================================
   TRANSFORMAR TAREFAS EM OBJECTOS
========================================================= */

function createDefaultTasks() {

    return predefinedTasks.map(item => ({

        id:
            Date.now() +
            Math.random(),

        title: item[0],

        category: item[1],

        responsible: item[2],

        priority: item[3],

        date: "",

        notes: "",

        completed: false,

        custom: false

    }));

}


/* =========================================================
   ARMAZENAMENTO
========================================================= */

const STORAGE_KEY =
    "casamento_perfeito_planeador";


function loadTasks() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {

        try {

            return JSON.parse(saved);

        } catch (error) {

            console.log(
                "Não foi possível carregar as tarefas."
            );

        }

    }

    return createDefaultTasks();

}


let tasks = loadTasks();


function saveTasks() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tasks)
    );

}


/* =========================================================
   ESTADO
========================================================= */

let currentCategory = "Todas";


const taskList =
    document.getElementById("taskList");

const search =
    document.getElementById("search");

const statusFilter =
    document.getElementById("statusFilter");

const priorityFilter =
    document.getElementById("priorityFilter");


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   CLASSE DA PRIORIDADE
========================================================= */

function priorityClass(priority) {

    if (priority === "Alta")
        return "priority-alta";

    if (priority === "Média")
        return "priority-media";

    return "priority-baixa";

}


/* =========================================================
   MOSTRAR PROGRESSO DA CATEGORIA
========================================================= */

function renderCategoryProgress() {

    let categoryTasks;

    if (currentCategory === "Todas") {

        categoryTasks = tasks;

    } else {

        categoryTasks =
            tasks.filter(
                task =>
                    task.category === currentCategory
            );

    }

    const total =
        categoryTasks.length;

    const completed =
        categoryTasks.filter(
            task => task.completed
        ).length;

    const percentage =
        total === 0
            ? 0
            : Math.round(
                completed / total * 100
            );

    document.getElementById(
        "categoryProgress"
    ).innerHTML = `

        <div class="category-progress-header">

            <strong>
                Progresso ${
                    currentCategory === "Todas"
                        ? "geral"
                        : escapeHTML(currentCategory)
                }
            </strong>

            <span>
                ${completed}/${total}
                (${percentage}%)
            </span>

        </div>

        <div class="mini-progress">

            <div
                style="width:${percentage}%"
            ></div>

        </div>

    `;

}


/* =========================================================
   RENDERIZAR TAREFAS
========================================================= */

function renderTasks() {

    const searchText =
        search.value
            .toLowerCase()
            .trim();

    const status =
        statusFilter.value;

    const priority =
        priorityFilter.value;


    const filtered =
        tasks.filter(task => {

            const categoryMatch =
                currentCategory === "Todas" ||
                task.category === currentCategory;


            const searchMatch =
                task.title
                    .toLowerCase()
                    .includes(searchText);


            const statusMatch =
                status === "todos" ||

                (
                    status === "concluida" &&
                    task.completed
                ) ||

                (
                    status === "pendente" &&
                    !task.completed
                );


            const priorityMatch =
                priority === "todas" ||
                task.priority === priority;


            return (
                categoryMatch &&
                searchMatch &&
                statusMatch &&
                priorityMatch
            );

        });


    if (filtered.length === 0) {

        taskList.innerHTML = `

            <div class="empty">

                <h3>
                    Nenhuma tarefa encontrada
                </h3>

                <p>
                    Tente alterar os filtros ou adicionar uma nova tarefa.
                </p>

            </div>

        `;

        renderCategoryProgress();

        return;

    }


    taskList.innerHTML =
        filtered.map(task => `

            <div
                class="task ${
                    task.completed
                        ? "completed"
                        : ""
                }"
            >

                <input
                    type="checkbox"
                    class="task-checkbox"
                    ${
                        task.completed
                            ? "checked"
                            : ""
                    }
                    onchange="toggleTask('${task.id}')"
                >


                <div class="task-info">

                    <div class="task-title">

                        ${escapeHTML(task.title)}

                    </div>


                    <div class="task-meta">

                        <span class="badge">

                            👤
                            ${escapeHTML(
                                task.responsible
                            )}

                        </span>


                        <span class="badge">

                            📁
                            ${escapeHTML(
                                task.category
                            )}

                        </span>


                        <span class="badge">

                            📅
                            ${
                                task.date
                                    ? escapeHTML(task.date)
                                    : "Sem prazo"
                            }

                        </span>


                        <span
                            class="badge ${
                                priorityClass(
                                    task.priority
                                )
                            }"
                        >

                            ${escapeHTML(
                                task.priority
                            )}

                        </span>


                        ${
                            task.completed
                                ? `
                                    <span class="badge">
                                        ✅ Concluída
                                    </span>
                                  `
                                : `
                                    <span class="badge">
                                        ⏳ Pendente
                                    </span>
                                  `
                        }

                    </div>

                </div>


                <div class="task-actions">

                    <button
                        class="delete-btn"
                        title="Eliminar tarefa"
                        onclick="deleteTask('${task.id}')"
                    >
                        🗑️
                    </button>

                </div>

            </div>

        `)
        .join("");


    renderCategoryProgress();

}


/* =========================================================
   ACTUALIZAR RESUMO
========================================================= */

function updateSummary() {

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            task => task.completed
        ).length;


    const pending =
        total - completed;


    const progress =
        total === 0
            ? 0
            : Math.round(
                completed / total * 100
            );


    document.getElementById(
        "totalTasks"
    ).textContent = total;


    document.getElementById(
        "completedTasks"
    ).textContent = completed;


    document.getElementById(
        "pendingTasks"
    ).textContent = pending;


    document.getElementById(
        "progressText"
    ).textContent =
        progress + "%";


    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";

}


/* =========================================================
   CONCLUIR TAREFA
========================================================= */

function toggleTask(id) {

    const task =
        tasks.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!task)
        return;


    task.completed =
        !task.completed;


    saveTasks();

    updateSummary();

    renderTasks();

}


/* =========================================================
   ELIMINAR TAREFA
========================================================= */

function deleteTask(id) {

    const task =
        tasks.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!task)
        return;


    const confirmed =
        confirm(
            `Eliminar a tarefa "${task.title}"?`
        );


    if (!confirmed)
        return;


    tasks =
        tasks.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    saveTasks();

    updateSummary();

    renderTasks();

}


/* =========================================================
   CATEGORIAS
========================================================= */

document
    .querySelectorAll(".category-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".category-btn"
                    )

                        btn.classList.remove(

                    );


                button.classList.add(

        );

    });


/* =========================================================
   FILTROS
========================================================= */

search.addEventListener(

);


statusFilter.addEventListener(

);

/* =========================================================

========================================================= */

const modal =

        "taskModal"
    );


document

        "click",

            );

        }

modal.addEventListener(
    "click",
    event => {

    }

/* =========================================================
   NOVA TAREFA
========================================================= */

document
    .getElementById("taskForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();


            const newTask = {

                id:
                    Date.now() +
                    Math.random(),

                title:
                    document
                        .getElementById(
                            "taskName"
                        )
                        .value
                        .trim(),

                category:
                    document
                        .getElementById(
                            "taskCategory"
                        )
                        .value,

                responsible:
                    document
                        .getElementById(
                            "taskResponsible"
                        )
                        .value,

                date:
                    document
                        .getElementById(
                            "taskDate"
                        )
                        .value,

                priority:
                    document
                        .getElementById(
                            "taskPriority"
                        )
                        .value,

                notes:
                    document
                        .getElementById(
                            "taskNotes"
                        )
                        .value
                        .trim(),

                completed:
                    false,

                custom:
                    true

            };


            tasks.push(
                newTask
            );


            saveTasks();


            event.target.reset();


            modal.classList.remove(
                "show"
            );


            currentCategory =
                newTask.category;


            document
                .querySelectorAll(
                    ".category-btn"
                )
                .forEach(btn => {

                    btn.classList.toggle(
                        "active",
                        btn.dataset.category ===
                            currentCategory
                    );

                });


            updateSummary();

            renderTasks();

        }
    );


/* =========================================================
   CSV
========================================================= */

function exportCSV() {

    const header =
        [
            "Categoria",
            "Tarefa",
            "Responsável",
            "Prazo",
            "Prioridade",
            "Estado",
            "Notas"
        ];


    const rows =
        tasks.map(task => [

            task.category,
            task.title,
            task.responsible,
            task.date,
            task.priority,

            task.completed
                ? "Concluída"
                : "Pendente",

            task.notes

        ]);


    const csv =
        [
            header,
            ...rows
        ]
        .map(row =>
            row
                .map(value =>
                    `"${String(value ?? "")
                        .replace(/"/g, '""')}"`
                )
                .join(",")
        )
        .join("\n");


    downloadFile(
        "\ufeff" + csv,
        "planeador-casamento.csv",
        "text/csv;charset=utf-8;"
    );

}


/* =========================================================
   EXCEL
========================================================= */

function exportExcel() {

    if (
        typeof XLSX ===
        "undefined"
    ) {

        alert(
            "Não foi possível carregar o módulo Excel. Verifique a ligação à Internet."
        );

        return;

    }


    const data =
        tasks.map(task => ({

            "Categoria":
                task.category,

            "Tarefa":
                task.title,

            "Responsável":
                task.responsible,

            "Prazo":
                task.date,

            "Prioridade":
                task.priority,

            "Estado":
                task.completed
                    ? "Concluída"
                    : "Pendente",

            "Notas":
                task.notes

        }));


    const worksheet =
        XLSX.utils.json_to_sheet(
            data
        );


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Tarefas"
    );


    XLSX.writeFile(
        workbook,
        "planeador-casamento.xlsx"
    );

}


/* =========================================================
   PDF
========================================================= */

function exportPDF() {

    window.print();

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(
    content,
    filename,
    type
) {

    const blob =
        new Blob(
            [content],
            { type }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   BOTÕES DE RELATÓRIO
========================================================= */

document

document
    .getElementById("printBtn")

    );


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

updateSummary();

renderTasks();

</script>
