<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar conta | Casamento Perfeito</title>

<style>

/* ==============================
   CONFIGURAÇÕES GERAIS
============================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            135deg,
            #f9edef,
            #f5e1e6
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 35px 20px;
}


/* ==============================
   CARTÃO PRINCIPAL
============================== */

.register-card {

    width: 920px;
    max-width: 95vw;

    min-height: 580px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    background: #ffffff;

    border-radius: 22px;

    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(80, 40, 50, 0.20);
}


/* ==============================
   LADO DO FORMULÁRIO
============================== */

.form-side {

    padding: 40px 50px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    background: #ffffff;
}


/* ==============================
   MENU
============================== */

.menu {

    display: flex;

    gap: 28px;

    margin-bottom: 25px;
}

.menu a {

    text-decoration: none;

    font-size: 12px;

    color: #777;
}

.menu a:hover {

    color: #b56876;
}

.menu a.active {

    color: #b56876;

    font-weight: bold;
}


/* ==============================
   LOGO
============================== */

.logo {

    margin-bottom: 27px;
}

.logo h1 {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 24px;

    color: #b55f70;

    font-weight: bold;
}

.logo span {

    display: block;

    margin-top: 4px;

    font-size: 8px;

    letter-spacing: 1.6px;

    color: #999;

    text-transform: uppercase;
}


/* ==============================
   TÍTULO
============================== */

.welcome {

    margin-bottom: 22px;
}

.welcome h2 {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 28px;

    font-weight: normal;

    color: #292929;

    margin-bottom: 7px;
}

.welcome p {

    font-size: 13px;

    color: #777;

    line-height: 1.5;
}


/* ==============================
   CAMPOS
============================== */

.campo {

    margin-bottom: 13px;
}

.campo label {

    display: block;

    font-size: 10px;

    color: #444;

    margin-bottom: 6px;
}

.campo input {

    width: 100%;

    height: 42px;

    padding: 0 13px;

    border: 1px solid #dedede;

    border-radius: 5px;

    background: #ffffff;

    color: #333;

    font-size: 12px;

    outline: none;

    transition: all 0.2s ease;
}

.campo input::placeholder {

    color: #aaa;
}

.campo input:focus {

    border-color: #b56876;

    box-shadow:
        0 0 0 2px rgba(181,104,118,0.10);
}


/* ==============================
   TERMOS
============================== */

.terms {

    display: flex;

    align-items: flex-start;

    gap: 7px;

    margin-top: 3px;

    margin-bottom: 17px;

    font-size: 9px;

    color: #777;

    line-height: 1.5;
}

.terms input {

    margin-top: 2px;

    accent-color: #b56876;
}

.terms label {

    cursor: pointer;
}

.terms a {

    color: #a65a6b;

    text-decoration: none;

    font-weight: bold;
}

.terms a:hover {

    text-decoration: underline;
}


/* ==============================
   BOTÃO
============================== */

.btn-criar {

    width: 100%;

    height: 43px;

    border: none;

    border-radius: 5px;

    background: #b56876;

    color: #ffffff;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

    transition: all 0.25s ease;
}

.btn-criar:hover {

    background: #a45363;

    transform: translateY(-1px);

    box-shadow:
        0 5px 15px rgba(165,83,99,0.20);
}


/* ==============================
   LOGIN
============================== */

.login {

    text-align: center;

    margin-top: 18px;

    padding-top: 15px;

    border-top: 1px solid #eeeeee;

    font-size: 10px;

    color: #777;
}

.login a {

    color: #a85d6d;

    text-decoration: none;

    font-weight: bold;
}

.login a:hover {

    text-decoration: underline;
}


/* ==============================
   VOLTAR
============================== */

.voltar {

    display: block;

    text-align: center;

    margin-top: 12px;

    font-size: 9px;

    color: #999;

    text-decoration: none;
}

.voltar:hover {

    color: #a85d6d;
}


/* ==============================
   IMAGEM À DIREITA
============================== */

.flower-side {

    position: relative;

    min-height: 580px;

    background-image:
        url("./images/images.jpg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;
}


/* Pequeno efeito sobre a fotografia */

.flower-side::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.04),
            rgba(255,255,255,0)
        );

    pointer-events: none;
}


/* ==============================
   RESPONSIVO
============================== */

@media (max-width: 750px) {

    body {

        padding: 20px;
    }

    .register-card {

        width: 100%;

        max-width: 450px;

        grid-template-columns: 1fr;
    }

    .flower-side {

        min-height: 260px;

        order: -1;
    }

    .form-side {

        padding: 35px 28px;
    }
}


@media (max-width: 450px) {

    .flower-side {

        min-height: 220px;
    }

    .form-side {

        padding: 30px 22px;
    }

    .welcome h2 {

        font-size: 24px;
    }
}

</style>

</head>


<body>


<!-- =====================================
     CARTÃO DE REGISTO
====================================== -->

<div class="register-card">


    <!-- =================================
         FORMULÁRIO
    ================================== -->

    <section class="form-side">


        <!-- MENU -->

        <nav class="menu">

            <a href="login.html">
                Entrar
            </a>

            <a
                href="registo.html"
                class="active"
            >
                Criar conta
            </a>

        </nav>


        <!-- LOGO -->

        <div class="logo">

            <h1>
                Casamento Perfeito
            </h1>

            <span>
                O seu grande dia começa aqui
            </span>

        </div>


        <!-- TÍTULO -->

        <div class="welcome">

            <h2>
                Criar a sua conta
            </h2>

            <p>
                Comece a organizar o casamento dos seus sonhos.
            </p>

        </div>


        <!-- FORMULÁRIO -->

        <form id="registerForm">


            <!-- NOME -->

            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Introduza o seu nome"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Introduza o seu e-mail"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="campo">

                <label for="password">
                    Palavra-passe
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crie a sua palavra-passe"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRMAR PASSWORD -->

            <div class="campo">

                <label for="confirmPassword">
                    Confirmar palavra-passe
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Repita a sua palavra-passe"
                    minlength="6"
                    required
                >

            </div>


            <!-- TERMOS -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">

                    Aceito os

                    <a href="termos.html">
                        Termos de Serviço
                    </a>

                    e a

                    <a href="privacidade.html">
                        Política de Privacidade
                    </a>.

                </label>

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                class="btn-criar"
            >
                Criar conta
            </button>


            <!-- LOGIN -->

            <div class="login">

                Já tem uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </div>


            <!-- VOLTAR -->

            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar à página inicial
            </a>


        </form>

    </section>


    <!-- =================================
         FOTOGRAFIA
    ================================== -->

    <section class="flower-side">
    </section>


</div>


<!-- =====================================
     JAVASCRIPT
====================================== -->

<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        function(event) {

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (password !== confirmPassword) {

                event.preventDefault();

                alert(
                    "As palavras-passe não coincidem."
                );

            }

        }
    );

</script>


</body>
</html>
