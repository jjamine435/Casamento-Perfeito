<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Casamento Perfeito</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background: #f7e8ec;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }


        /* CARTÃO */

        .register-card {
            width: 920px;
            max-width: 100%;

            min-height: 580px;

            background: white;

            display: grid;
            grid-template-columns: 1fr 1fr;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(90, 50, 60, 0.20);
        }


        /* FORMULÁRIO */

        .form-side {
            padding: 40px 50px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        /* MENU */

        .menu {
            display: flex;
            gap: 28px;

            margin-bottom: 25px;
        }

        .menu a {
            color: #777;
            text-decoration: none;

            font-size: 12px;
        }

        .menu a:hover {
            color: #b35d70;
        }

        .menu .active {
            color: #b35d70;
            font-weight: bold;
        }


        /* LOGO */

        .logo {
            margin-bottom: 25px;
        }

        .logo h1 {
            font-family: Georgia, serif;

            color: #b45d70;

            font-size: 25px;
        }

        .logo span {
            display: block;

            margin-top: 5px;

            color: #999;

            font-size: 8px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        /* TÍTULO */

        .welcome {
            margin-bottom: 22px;
        }

        .welcome h2 {
            font-family: Georgia, serif;

            color: #292929;

            font-size: 29px;

            font-weight: normal;

            margin-bottom: 7px;
        }

        .welcome p {
            color: #777;

            font-size: 13px;

            line-height: 1.5;
        }


        /* CAMPOS */

        .campo {
            margin-bottom: 13px;
        }

        .campo label {
            display: block;

            margin-bottom: 6px;

            color: #444;

            font-size: 10px;
        }

        .campo input {
            width: 100%;

            height: 42px;

            padding: 0 13px;

            border: 1px solid #ddd;

            border-radius: 5px;

            outline: none;

            font-size: 12px;
        }

        .campo input:focus {
            border-color: #b45d70;
        }


        /* TERMOS */

        .terms {
            display: flex;

            align-items: flex-start;

            gap: 7px;

            margin: 4px 0 17px;

            color: #777;

            font-size: 9px;

            line-height: 1.5;
        }

        .terms input {
            margin-top: 2px;
        }

        .terms a {
            color: #a85a6b;

            font-weight: bold;

            text-decoration: none;
        }


        /* BOTÃO */

        .btn-criar {
            width: 100%;

            height: 43px;

            border: none;

            border-radius: 5px;

            background: #b45d70;

            color: white;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;
        }

        .btn-criar:hover {
            background: #9f4d60;
        }


        /* LOGIN */

        .login {
            text-align: center;

            margin-top: 18px;
            padding-top: 15px;

            border-top: 1px solid #eee;

            color: #777;

            font-size: 10px;
        }

        .login a {
            color: #a85a6b;

            font-weight: bold;

            text-decoration: none;
        }


        /* VOLTAR */

        .voltar {
            display: block;

            text-align: center;

            margin-top: 12px;

            color: #999;

            font-size: 9px;

            text-decoration: none;
        }


        /* =================================
           FOTOGRAFIA
        ================================= */

        .flower-side {
            position: relative;

            width: 100%;
            min-height: 580px;

            overflow: hidden;

            background: #f1d8de;
        }

        .flower-side img {
            width: 100%;
            height: 100%;

            min-height: 580px;

            display: block;

            object-fit: cover;

            object-position: center;
        }


        /* RESPONSIVO */

        @media (max-width: 750px) {

            body {
                padding: 15px;
            }

            .register-card {
                grid-template-columns: 1fr;

                max-width: 450px;
            }

            .flower-side {
                order: -1;

                min-height: 300px;
            }

            .flower-side img {
                min-height: 300px;
            }

            .form-side {
                padding: 35px 28px;
            }
        }

    </style>

</head>


<body>


    <div class="register-card">


        <!-- ==========================
             FORMULÁRIO
        =========================== -->

        <section class="form-side">


            <nav class="menu">

                <a href="login.html">
                    Entrar
                </a>

                <a href="registo.html" class="active">
                    Criar conta
                </a>

            </nav>


            <div class="logo">

                <h1>
                    Casamento Perfeito
                </h1>

                <span>
                    O seu grande dia começa aqui
                </span>

            </div>


            <div class="welcome">

                <h2>
                    Criar a sua conta
                </h2>

                <p>
                    Comece a organizar o casamento dos seus sonhos.
                </p>

            </div>


            <form id="registerForm">


                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Introduza o seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Introduza o seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Palavra-passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crie a sua palavra-passe"
                        minlength="6"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmPassword">
                        Confirmar palavra-passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repita a sua palavra-passe"
                        minlength="6"
                        required
                    >

                </div>


                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">

                        Aceito os

                        <a href="termos.html">
                            Termos de Serviço
                        </a>

                        e a

                        <a href="privacidade.html">
                            Política de Privacidade
                        </a>.

                    </label>

                </div>


                <button
                    type="submit"
                    class="btn-criar"
                >
                    Criar conta
                </button>


                <div class="login">

                    Já tem uma conta?

                    <a href="login.html">
                        Entrar
                    </a>

                </div>


                <a
                    href="index.html"
                    class="voltar"
                >
                    ← Voltar à página inicial
                </a>


            </form>

        </section>


        <!-- ==========================
             FOTOGRAFIA
        =========================== -->

        <section class="flower-side">

            <img
                src="images/images.jpg"
                alt="Rosas de casamento"
            >

        </section>


    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                if (password !== confirmPassword) {

                    event.preventDefault();

                    alert(
                        "As palavras-passe não coincidem."
                    );

                }

            });

    </script>


</body>
</html>
