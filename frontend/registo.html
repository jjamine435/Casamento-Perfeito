<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Casamento Perfeito</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff4f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .register-card {
            width: 920px;
            max-width: 100%;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .register-side {
            padding: 45px;
        }

        .menu {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-bottom: 35px;
        }

        .menu a {
            text-decoration: none;
            color: #9b596f;
            font-size: 14px;
        }

        .logo {
            color: #c66b88;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        h1 {
            color: #4b3039;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #4b3039;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e4cbd3;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c66b88;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 18px 0;
            font-size: 13px;
            color: #777;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        .terms a {
            color: #c66b88;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #c66b88;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b45877;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .success {
            background: #e9f8ee;
            color: #26723d;
        }

        .error {
            background: #fdebed;
            color: #a33a48;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #c66b88;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #999;
            text-decoration: none;
            font-size: 13px;
        }

        .flower-side {
            min-height: 650px;
            overflow: hidden;
        }

        .flower-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 750px) {
            .register-card {
                grid-template-columns: 1fr;
            }

            .flower-side {
                display: none;
            }

            .register-side {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">

    <section class="register-side">

        <div class="menu">
            <a href="login.html">Entrar</a>
            <a href="registo.html">Criar conta</a>
        </div>

        <div class="logo">
            💕 Casamento Perfeito
        </div>

        <h1>Criar a sua conta</h1>

        <p class="subtitle">
            Comece a planear o seu grande dia de forma simples,
            organizada e especial.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o seu nome"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="exemplo@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Palavra-passe</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Crie uma palavra-passe"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar palavra-passe</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repita a palavra-passe"
                    required
                >
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>

                <label for="terms">
                    Aceito os termos de utilização e a política de privacidade.
                </label>
            </div>

            <button type="submit">
                Criar conta
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="login-link">
            Já tem uma conta?
            <a href="login.html">Entrar</a>
        </div>

        <a class="back-home" href="index.html">
            ← Voltar à página inicial
        </a>

    </section>

    <section class="flower-side">

        <img
            src="./images/images.jpg"
            alt="Rosas de casamento"
        >

    </section>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    message.style.display = "none";
    message.className = "message";

    if (password !== confirmPassword) {

        message.textContent = "As palavras-passe não coincidem.";
        message.classList.add("error");
        message.style.display = "block";

        return;
    }

    if (password.length < 6) {

        message.textContent =
            "A palavra-passe deve ter pelo menos 6 caracteres.";

        message.classList.add("error");
        message.style.display = "block";

        return;
    }

    const utilizadores =
        JSON.parse(localStorage.getItem("casamentoPerfeitoUtilizadores")) || [];

    const utilizadorExistente =
        utilizadores.find(user => user.email === email);

    if (utilizadorExistente) {

        message.textContent =
            "Já existe uma conta registada com este e-mail.";

        message.classList.add("error");
        message.style.display = "block";

        return;
    }

    const novoUtilizador = {
        nome: nome,
        email: email,
        password: password
    };

    utilizadores.push(novoUtilizador);

    localStorage.setItem(
        "casamentoPerfeitoUtilizadores",
        JSON.stringify(utilizadores)
    );

    message.textContent =
        "Conta criada com sucesso! Será encaminhado para o login.";

    message.classList.add("success");
    message.style.display = "block";

    document.getElementById("registerForm").reset();

    setTimeout(function() {
        window.location.href = "login.html";
    }, 1500);

});

</script>

</body>
</html>
