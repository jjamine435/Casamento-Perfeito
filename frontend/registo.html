<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar conta | Casamento Perfeito</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7e9ec;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 40px 20px;
}

/* CARTÃO PRINCIPAL */

.register-card {
    width: min(920px, 95vw);
    min-height: 570px;

    background: #ffffff;

    border-radius: 24px;
    overflow: hidden;

    display: grid;
    grid-template-columns: 1fr 1fr;

    box-shadow: 0 25px 70px rgba(0,0,0,0.18);
}

/* LADO DO FORMULÁRIO */

.form-side {
    padding: 42px 50px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    background: #ffffff;
}

/* MENU */

.menu {
    display: flex;
    gap: 25px;

    margin-bottom: 30px;
}

.menu a {
    color: #777;
    text-decoration: none;

    font-size: 12px;
}

.menu a.active {
    color: #b56876;
    font-weight: bold;
}

/* LOGO */

.logo {
    margin-bottom: 28px;
}

.logo h1 {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 23px;

    color: #b55f70;
}

.logo span {
    display: block;

    margin-top: 4px;

    font-size: 8px;

    letter-spacing: 1.5px;

    color: #999;

    text-transform: uppercase;
}

/* TÍTULO */

.welcome {
    margin-bottom: 22px;
}

.welcome h2 {
    font-size: 27px;

    color: #222;

    margin-bottom: 7px;
}

.welcome p {
    color: #777;

    font-size: 13px;

    line-height: 1.5;
}

/* CAMPOS */

.campo {
    margin-bottom: 14px;
}

.campo label {
    display: block;

    font-size: 10px;

    color: #444;

    margin-bottom: 6px;
}

.campo input {
    width: 100%;

    height: 42px;

    border: 1px solid #dedede;

    border-radius: 6px;

    padding: 0 12px;

    font-size: 12px;

    color: #444;

    outline: none;

    background: #fff;

    transition: 0.2s;
}

.campo input:focus {
    border-color: #b56a78;

    box-shadow:
        0 0 0 2px rgba(181,106,120,0.10);
}

/* TERMOS */

.terms {
    display: flex;

    align-items: flex-start;

    gap: 7px;

    margin: 3px 0 18px;

    font-size: 9px;

    color: #777;

    line-height: 1.5;
}

.terms input {
    margin-top: 2px;

    accent-color: #b56a78;
}

.terms a {
    color: #a65a6b;

    text-decoration: none;

    font-weight: bold;
}

/* BOTÃO */

.btn-criar {
    width: 100%;

    height: 43px;

    border: none;

    border-radius: 5px;

    background: #b56876;

    color: white;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;
}

.btn-criar:hover {
    background: #a45363;

    transform: translateY(-1px);
}

/* LOGIN */

.login {
    text-align: center;

    margin-top: 19px;

    padding-top: 16px;

    border-top: 1px solid #eee;

    font-size: 10px;

    color: #777;
}

.login a {
    color: #a85d6d;

    text-decoration: none;

    font-weight: bold;
}

/* VOLTAR */

.voltar {
    display: block;

    text-align: center;

    margin-top: 12px;

    color: #999;

    font-size: 9px;

    text-decoration: none;
}

.voltar:hover {
    color: #a85d6d;
}

/* IMAGEM DAS ROSAS */

.flower-side {
    position: relative;
    background-image: url("./images/rosas.jpg");
    background-size: cover;
    background-position: center;
    min-height: 570px;
}

/* EFEITO SUAVE SOBRE A IMAGEM */

.flower-side::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.05),
            rgba(255,255,255,0)
        );
}

/* RESPONSIVO */

@media (max-width: 750px) {

    body {
        padding: 20px;
    }

    .register-card {
        grid-template-columns: 1fr;

        max-width: 450px;
    }

    .flower-side {
        min-height: 250px;

        order: -1;
    }

    .form-side {
        padding: 35px 28px;
    }
}

@media (max-width: 450px) {

    .flower-side {
        min-height: 210px;
    }

    .form-side {
        padding: 30px 22px;
    }

    .welcome h2 {
        font-size: 23px;
    }
}

</style>

</head>

<body>

<div class="register-card">

    <!-- FORMULÁRIO -->

    <section class="form-side">

        <nav class="menu">

            <a href="login.html">
                Entrar
            </a>

            <a href="registo.html" class="active">
                Criar conta
            </a>

        </nav>


        <div class="logo">

            <h1>
                Casamento Perfeito
            </h1>

            <span>
                O seu grande dia começa aqui
            </span>

        </div>


        <div class="welcome">

            <h2>
                Criar a sua conta
            </h2>

            <p>
                Comece a organizar o casamento dos seus sonhos.
            </p>

        </div>


        <form id="registerForm">

            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Introduza o seu nome"
                    required
                >

            </div>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Introduza o seu e-mail"
                    required
                >

            </div>


            <div class="campo">

                <label for="password">
                    Palavra-passe
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crie a sua palavra-passe"
                    minlength="6"
                    required
                >

            </div>


            <div class="campo">

                <label for="confirmPassword">
                    Confirmar palavra-passe
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Repita a sua palavra-passe"
                    minlength="6"
                    required
                >

            </div>


            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">

                    Aceito os
                    <a href="#">
                        Termos de Serviço
                    </a>

                    e a

                    <a href="#">
                        Política de Privacidade
                    </a>.

                </label>

            </div>


            <button
                type="submit"
                class="btn-criar"
            >
                Criar conta
            </button>


            <div class="login">

                Já tem uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </div>


            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar à página inicial
            </a>

        </form>

    </section>


    <!-- IMAGEM -->

    <section class="flower-side">
    </section>

</div>


<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

            event.preventDefault();

            alert(
                "As palavras-passe não coincidem."
            );

        }

    });

</script>

</body>

</html>
